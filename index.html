// ---------- SEGURIDAD: neutraliza cualquier código HTML en texto de usuarios ----------
function esc(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ---------- VALIDACIÓN DE DNI Y CUIT/CUIL ----------
function validarDNI(dni) {
  const digitos = (dni || '').replace(/\D/g, '');
  return /^\d{7,8}$/.test(digitos);
}
function validarCUIT(cuit) {
  const digitos = (cuit || '').replace(/\D/g, '');
  if (!/^\d{11}$/.test(digitos)) return false;
  const multiplicadores = [5, 4, 3, 2, 7, 6, 5, 4, 3, 2];
  let suma = 0;
  for (let i = 0; i < 10; i++) suma += parseInt(digitos[i], 10) * multiplicadores[i];
  let verificador = 11 - (suma % 11);
  if (verificador === 11) verificador = 0;
  if (verificador === 10) return false;
  return verificador === parseInt(digitos[10], 10);
}
// ---------- VISTA PREVIA DE ARCHIVOS (imágenes y PDF) ----------
function esImagenArchivo(nombre) {
  return /\.(jpe?g|png|gif|webp)$/i.test(nombre || '');
}
function esPDFArchivo(nombre) {
  return /\.pdf$/i.test(nombre || '');
}
function htmlPreviewArchivo(nombre, url) {

  return '';
}

// ---------- BLOQUEO CON HUELLA / FACE ID (WebAuthn, local al dispositivo) ----------
function tieneCredencialGuardada() {
  return !!localStorage.getItem('bioCredId');
}

async function activarBloqueoHuella() {
  if (!window.PublicKeyCredential) {
    alert('Este navegador no soporta bloqueo con huella o Face ID.');
    return;
  }
  try {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const credential = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'Portal de Clientes - Dr. Diego Mayorga' },
        user: {
          id: userId,
          name: auth.currentUser?.email || 'usuario',
          displayName: auth.currentUser?.email || 'usuario'
        },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000
      }
    });
    const credIdB64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
    localStorage.setItem('bioCredId', credIdB64);
    alert('Bloqueo con huella/Face ID activado en este dispositivo.');
  } catch (err) {
    alert('No se pudo activar el bloqueo: ' + err.message);
  }
}

function desactivarBloqueoHuella() {
  localStorage.removeItem('bioCredId');
  alert('Bloqueo con huella/Face ID desactivado en este dispositivo.');
}

async function pedirDesbloqueoHuella() {
  const credIdB64 = localStorage.getItem('bioCredId');
  if (!credIdB64) return true;
  try {
    const credIdBytes = Uint8Array.from(atob(credIdB64), (c) => c.charCodeAt(0));
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ id: credIdBytes, type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000
      }
    });
    return true;
  } catch (err) {
    return false;
  }
}

// ---------- NOTIFICACIONES PUSH (solo para el administrador) ----------
async function activarNotificaciones(uid, esAdmin) {
  const cajaEstado = document.getElementById('estadoNotif');
  if (!('Notification' in window) || !messaging) {
    if (cajaEstado) cajaEstado.textContent = 'Este navegador no soporta notificaciones.';
    return;
  }
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') {
      if (cajaEstado) cajaEstado.textContent = 'Notificaciones desactivadas. Activalas desde el navegador si querés recibir alertas.';
      return;
    }
    const registro = await navigator.serviceWorker.ready;
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registro });
    if (token) {
      if (esAdmin) {
        await setDoc(doc(db, 'adminTokens', token), {
          uid, fecha: serverTimestamp(), dispositivo: navigator.userAgent
        });
      } else {
        await setDoc(doc(db, 'clientes', uid, 'tokens', token), {
          fecha: serverTimestamp(), dispositivo: navigator.userAgent
        });
      }
      if (cajaEstado) cajaEstado.textContent = '🔔 Notificaciones activadas en este dispositivo.';
    }
  } catch (err) {
    console.log('No se pudo activar notificaciones:', err.message);
    if (cajaEstado) cajaEstado.textContent = 'No se pudieron activar las notificaciones: ' + err.message;
  }
}

    <input type="text" id="inEmailDominioOtro" placeholder="tudominio.com" class="oculto" style="margin-top:8px;" autocapitalize="off">
    <label>Contraseña</label>
    <input type="password" id="inPass" placeholder="Mínimo 6 caracteres">
    <button id="btnAccion">${modoRegistro ? 'Crear cuenta' : 'Ingresar'}</button>
    <div class="enlace-cambio" id="btnCambiar">
      ${modoRegistro ? '¿Ya tenés cuenta? Iniciar sesión' : '¿Primera vez? Crear una cuenta'}
    </div>
    ${!modoRegistro ? '<div class="enlace-cambio" id="btnOlvide">¿Olvidaste tu contraseña?</div>' : ''}
    <div id="avisoLogin"></div>
    ${htmlCajaInstalar()}
  `;

  wireCajaInstalar();
  document.getElementById('btnCambiar').onclick = () => pantallaLogin(!modoRegistro);

  document.getElementById('inEmailDominio').addEventListener('change', (e) => {
    const inputOtro = document.getElementById('inEmailDominioOtro');
    inputOtro.classList.toggle('oculto', e.target.value !== 'otro');
  });

  function obtenerEmailIngresado() {
    const usuario = document.getElementById('inEmailUsuario').value.trim();
    const dominioSelect = document.getElementById('inEmailDominio').value;
    const dominioOtro = document.getElementById('inEmailDominioOtro').value.trim();
    const dominio = dominioSelect === 'otro' ? dominioOtro : dominioSelect;
    return usuario.includes('@') ? usuario : (usuario && dominio ? `${usuario}@${dominio}` : '');
  }

  const btnOlvide = document.getElementById('btnOlvide');
  if (btnOlvide) {
    btnOlvide.onclick = async () => {
      const email = obtenerEmailIngresado();
      const aviso = document.getElementById('avisoLogin');
      if (!email) {
        aviso.innerHTML = '<div class="aviso error">Escribí primero tu email arriba, y después tocá "¿Olvidaste tu contraseña?".</div>';
        return;
      }
      aviso.innerHTML = '<div class="aviso ok">Enviando...</div>';
      try {
        await sendPasswordResetEmail(auth, email);
        aviso.innerHTML = '<div class="aviso ok">Si ese email tiene una cuenta creada, te enviamos un link para restablecer tu contraseña. Revisá tu bandeja de entrada y, si no lo ves ahí, también la carpeta de spam o correo no deseado.</div>';
      } catch (err) {
        aviso.innerHTML = '<div class="aviso error">' + traducirError(err.code) + '</div>';
      }
    };
  }

  document.getElementById('btnAccion').onclick = async () => {
    const email = obtenerEmailIngresado();
    const pass = document.getElementById('inPass').value;
    const aviso = document.getElementById('avisoLogin');
    if (!email || !pass) {
      aviso.innerHTML = '<div class="aviso error">Completá email y contraseña.</div>';
      return;
    }
    aviso.innerHTML = '<div class="aviso ok">Procesando...</div>';
    try {
      if (modoRegistro) {
        await createUserWithEmailAndPassword(auth, email, pass);
      } else {
        await signInWithEmailAndPassword(auth, email, pass);
      }
    } catch (err) {
      aviso.innerHTML = '<div class="aviso error">' + traducirError(err.code) + '</div>';
    }
  };

  // Permitir enviar el formulario apretando Enter en cualquiera de los campos
  ['inEmailUsuario', 'inEmailDominioOtro', 'inPass'].forEach(id => {
    const campo = document.getElementById(id);
    if (campo) {
      campo.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('btnAccion').click();
        }
      });
    }
  });
}

function traducirError(code) {
  const mapa = {
    'auth/email-already-in-use': 'Ese email ya tiene una cuenta creada. Probá iniciar sesión.',
    'auth/invalid-email': 'El email no es válido.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/invalid-credential': 'Email o contraseña incorrectos.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/user-not-found': 'No existe una cuenta con ese email.'
  };
  return mapa[code] || 'Ocurrió un error. Intentá de nuevo.';
}

function formatearFecha(fechaStr) {
  if (!fechaStr) return '';
  const [y, m, d] = fechaStr.split('-');
  if (!y || !m || !d) return fechaStr;
  return `${d}/${m}/${y}`;
}

    if (digitos.length > 10) resultado = digitos.slice(0, 2) + '-' + digitos.slice(2, 10) + '-' + digitos.slice(10);
    e.target.value = resultado;
  });

  document.getElementById('fDni').addEventListener('input', (e) => {

      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8);

    const dni = document.getElementById('fDni').value.trim();
    const cuit = document.getElementById('fCuit').value.trim();
    const estadoCivil = document.getElementById('fEstadoCivil').value;
    const ocupacion = document.getElementById('fOcupacion').value.trim();
    const telefono = document.getElementById('fTelefono').value.trim();
    const direccion = document.getElementById('fDireccion').value.trim();
    const codigoPostal = document.getElementById('fCodigoPostal').value.trim();
    const provincia = document.getElementById('fProvincia').value;
    const localidadSelect = document.getElementById('fLocalidad').value;
    const localidadOtra = document.getElementById('fLocalidadOtra').value.trim();
    const localidad = localidadSelect === OPCION_OTRA_LOCALIDAD ? localidadOtra : localidadSelect;
    const areaConsulta = document.getElementById('fAreaConsulta').value;
    const contactoNombre = document.getElementById('fContactoNombre').value.trim();
    const contactoTelefono = document.getElementById('fContactoTelefono').value.trim();
    const comoConocio = document.getElementById('fComoConocio').value;
    const aceptaPrivacidad = document.getElementById('fAceptaPrivacidad').checked;
    const aviso = document.getElementById('avisoForm');

    if (!apellido || !nombre || !dni) {
      aviso.innerHTML = '<div class="aviso error">Apellido, nombre y número de documento son obligatorios.</div>';
      return;
    }
    if (tipoDocumento === 'DNI' && !validarDNI(dni)) {
      aviso.innerHTML = '<div class="aviso error">El DNI debe tener 7 u 8 dígitos, sin puntos ni letras.</div>';
      return;
    }
    if (tipoDocumento !== 'DNI' && dni.length < 4) {
      aviso.innerHTML = '<div class="aviso error">Ingresá el número de documento completo (mínimo 4 caracteres).</div>';
      return;
    }
    if (cuit && !validarCUIT(cuit)) {
      aviso.innerHTML = '<div class="aviso error">El CUIT/CUIL no es válido. Revisá que esté completo y bien escrito (formato 20-12345678-9).</div>';
      return;
    }
    if (!aceptaPrivacidad) {
      aviso.innerHTML = '<div class="aviso error">Debés aceptar la Política de Privacidad para continuar.</div>';
      return;
    }
    aviso.innerHTML = '<div class="aviso ok">Guardando...</div>';
    try {
      const datos = {
        apellido, nombre, dni, tipoDocumento, telefono, direccion, provincia, localidad, fechaNacimiento,
        nacionalidad, cuit, estadoCivil, ocupacion, codigoPostal, areaConsulta,
        contactoNombre, contactoTelefono, comoConocio
      };
      const datosAGuardar = {
        ...datos,
        aceptaPrivacidad: true,
        fechaAceptacionPrivacidad: serverTimestamp(),
        email: user.email
      };
      if (!esEdicion) datosAGuardar.fechaRegistro = serverTimestamp();
      await setDoc(doc(db, 'clientes', user.uid), datosAGuardar, { merge: true });
      pantallaDashboard(user, datos);
    } catch (err) {
      aviso.innerHTML = '<div class="aviso error">Error al guardar: ' + err.message + '</div>';
    }
  };
}

// ---------- FUNCIÓN AUXILIAR: nombre completo para mostrar y ordenar ----------
function nombreCompleto(c) {
  if (c.apellido && c.nombre) return c.apellido + ', ' + c.nombre;
  return c.apellido || c.nombre || '';
}

// ---------- FUNCIÓN AUXILIAR: etiqueta de documento (tipo + número) ----------
function etiquetaDocumento(c) {
  if (!c.dni) return '';
  const tipo = c.tipoDocumento || 'DNI';
  return tipo + ': ' + c.dni;
}

function formatearMonto(monto) {
  const numero = Number(monto);
  if (isNaN(numero)) return monto;
  return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(numero);
}

async function cargarPresupuestosCliente(uid) {
  const cont = document.getElementById('listaPresupuestosCliente');
  if (!cont) return;
  try {
    const snap = await getDocs(query(collection(db, 'clientes', uid, 'presupuestos'), orderBy('fecha', 'desc')));
    if (snap.empty) {
      cont.innerHTML = '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no tenés presupuestos.</p>';
      return;
    }
    cont.innerHTML = snap.docs.map(d => {
      const p = d.data();
      const fecha = p.fecha ? new Date(p.fecha.seconds * 1000).toLocaleDateString('es-AR') : '';
      let estadoTexto = '⏳ Pendiente de tu respuesta';
      let botones = `
        <button class="chica btnAceptarPresupuesto" data-id="${d.id}" style="width:auto;background:#1e7a34;">Aceptar</button>
        <button class="chica btnRechazarPresupuesto" data-id="${d.id}" style="width:auto;background:#b32424;margin-left:8px;">Rechazar</button>
      `;
      if (p.estado === 'aceptado') { estadoTexto = '✅ Aceptado' + (p.pagado ? ' · 💰 Pagado' : ' · Pendiente de pago'); botones = ''; }
      if (p.estado === 'rechazado') { estadoTexto = '❌ Rechazado'; botones = ''; }
      return `<div class="lista-item">
        <strong>${esc(formatearMonto(p.monto))}</strong> — ${esc(p.descripcion)}<br>
        <small>${fecha} · ${estadoTexto}</small>
        ${botones ? '<div style="margin-top:8px;">' + botones + '</div>' : ''}
      </div>`;
    }).join('');

    cont.querySelectorAll('.btnAceptarPresupuesto, .btnRechazarPresupuesto').forEach(btn => {
      btn.onclick = async () => {
        const nuevoEstado = btn.classList.contains('btnAceptarPresupuesto') ? 'aceptado' : 'rechazado';
        try {
          await setDoc(doc(db, 'clientes', uid, 'presupuestos', btn.dataset.id), {
            estado: nuevoEstado, fechaRespuesta: serverTimestamp()
          }, { merge: true });
          cargarPresupuestosCliente(uid);
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };
    });
  } catch (err) {
    cont.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error: ' + err.message + '</p>';
  }
}

async function cargarAutorizacionesCliente(uid) {
  const cont = document.getElementById('listaAutorizacionesCliente');
  if (!cont) return;
  try {
    const snap = await getDocs(query(collection(db, 'clientes', uid, 'autorizaciones'), orderBy('fecha', 'desc')));
    if (snap.empty) {
      cont.innerHTML = '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no tenés autorizaciones para firmar.</p>';
      return;
    }
    cont.innerHTML = snap.docs.map(d => {
      const a = d.data();
      const fecha = a.fecha ? new Date(a.fecha.seconds * 1000).toLocaleDateString('es-AR') : '';
      if (a.estado === 'firmado') {
        const fechaFirma = a.fechaFirma ? new Date(a.fechaFirma.seconds * 1000).toLocaleString('es-AR') : '';
        return `<div class="lista-item">
          <strong>${esc(a.titulo)}</strong><br>
          <span style="white-space:pre-wrap;">${esc(a.texto)}</span><br>
          ${a.autorizadoNombre ? '<small>Autorizado: ' + esc(a.autorizadoNombre) + (a.autorizadoDni ? ' - DNI ' + esc(a.autorizadoDni) : '') + '</small><br>' : ''}
          <small>✅ Firmado el ${fechaFirma}${a.leidoCompleto ? ' (con confirmación de lectura completa del texto)' : ''}</small>
        </div>`;
      }
      return `<div class="lista-item">
        <strong>${esc(a.titulo)}</strong><br>
        <div class="textoAutorizacion" data-id="${d.id}" style="white-space:pre-wrap;max-height:150px;overflow-y:auto;border:1px solid #eee;border-radius:6px;padding:8px;margin-top:6px;background:#fafafa;">${esc(a.texto)}</div>
        <p style="font-size:11px;color:#b8860b;margin-top:4px;" class="avisoScroll" data-id="${d.id}">👆 Deslizá hasta el final del texto para poder firmar.</p>
        <div style="margin-top:8px;">
          <label>Nombre de la persona autorizada (si corresponde)</label>
          <input type="text" class="inputAutNombre" data-id="${d.id}">
          <label>DNI de la persona autorizada (si corresponde)</label>
          <input type="text" class="inputAutDni" data-id="${d.id}">
          <button class="chica btnFirmarAutorizacion" data-id="${d.id}" style="width:auto;" disabled>Confirmar y firmar electrónicamente</button>
        </div>
      </div>`;
    }).join('');

    cont.querySelectorAll('.textoAutorizacion').forEach(div => {
      const habilitarSiCorresponde = () => {
        const yaLlego = div.scrollHeight - div.scrollTop - div.clientHeight < 4;
        if (yaLlego) {
          const btn = cont.querySelector(`.btnFirmarAutorizacion[data-id="${div.dataset.id}"]`);
          const aviso = cont.querySelector(`.avisoScroll[data-id="${div.dataset.id}"]`);
          if (btn) btn.disabled = false;
          if (aviso) aviso.style.display = 'none';
        }
      };
      div.addEventListener('scroll', habilitarSiCorresponde);
      // Si el texto ya entra completo sin necesidad de scroll, habilitar de una
      habilitarSiCorresponde();
    });

    cont.querySelectorAll('.btnFirmarAutorizacion').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const autorizadoNombre = cont.querySelector(`.inputAutNombre[data-id="${id}"]`).value.trim();
        const autorizadoDni = cont.querySelector(`.inputAutDni[data-id="${id}"]`).value.trim();
        const ok = confirm('¿Confirmás la firma electrónica de esta autorización? Esta acción queda registrada con fecha y hora.');
        if (!ok) return;
        try {
          await setDoc(doc(db, 'clientes', uid, 'autorizaciones', id), {
            estado: 'firmado', autorizadoNombre, autorizadoDni, fechaFirma: serverTimestamp(), leidoCompleto: true
          }, { merge: true });
          cargarAutorizacionesCliente(uid);
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };
    });
  } catch (err) {
    cont.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error: ' + err.message + '</p>';
  }
}

async function cargarHistorial(uid, fechaVistaAdmin) {
  const cont = document.getElementById('listaHistorial');
  if (!cont) return;
  try {
    const [novSnap, arcSnap] = await Promise.all([
      getDocs(query(collection(db, 'clientes', uid, 'novedades'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'archivos'), orderBy('fecha', 'desc')))
    ]);
    let items = [];
    novSnap.forEach(d => items.push({ tipo: 'Nota', ...d.data() }));
    arcSnap.forEach(d => items.push({ tipo: 'Archivo', ...d.data() }));
    items.sort((a, b) => (b.fecha?.seconds || 0) - (a.fecha?.seconds || 0));

    if (items.length === 0) {
      cont.innerHTML = '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no hay novedades.</p>';
      return;
    }
    cont.innerHTML = items.map(it => {
      const fecha = it.fecha ? new Date(it.fecha.seconds * 1000).toLocaleString('es-AR') : '';
      const visto = it.fecha && fechaVistaAdmin && it.fecha.seconds <= fechaVistaAdmin.seconds
        ? '<span style="color:#1e7a34;font-size:11px;">✓ Leído por el estudio</span>'
        : '<span style="color:#b8860b;font-size:11px;">Pendiente de lectura</span>';
      if (it.tipo === 'Archivo') {
        return `<div class="lista-item">📎 <a href="${it.url}" target="_blank">${esc(it.nombre)}</a>${htmlPreviewArchivo(it.nombre, it.url)}<small>${fecha} · ${visto}</small></div>`;
      }
      return `<div class="lista-item">💬 ${esc(it.texto)}<small>${fecha} · ${visto}</small></div>`;
    }).join('');
  } catch (err) {
    cont.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error al cargar: ' + err.message + '</p>';
  }
}

async function mostrarEstadisticas() {
  const box = document.getElementById('estadisticasBox');
  if (!box) return;
  try {
    const clientesSnap = await getDocs(collection(db, 'clientes'));
    const totalClientes = clientesSnap.size;
    const mensajesSinResponder = clientesSnap.docs.filter(d => d.data().tieneNuevo).length;

    let presupuestosPendientes = 0;
    await Promise.all(clientesSnap.docs.map(async d => {
      const presSnap = await getDocs(query(collection(db, 'clientes', d.id, 'presupuestos'), where('estado', '==', 'pendiente')));
      presupuestosPendientes += presSnap.size;
    }));

    const eventos = await obtenerTodosLosEventos();
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const finSemana = new Date(hoy);
    finSemana.setDate(finSemana.getDate() + 7);
    const eventosSemana = eventos.filter(e => {
      const f = new Date(e.fecha + 'T00:00:00');
      return f >= hoy && f <= finSemana;
    }).length;

    box.innerHTML = `
      <div class="caja" style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-around;text-align:center;">
        <div><div style="font-size:22px;font-weight:bold;color:#0F1E3D;">${totalClientes}</div><div style="font-size:12px;font-family:Arial,sans-serif;color:#666;">Clientes</div></div>
        <div><div style="font-size:22px;font-weight:bold;color:#0F1E3D;">${mensajesSinResponder}</div><div style="font-size:12px;font-family:Arial,sans-serif;color:#666;">Mensajes nuevos</div></div>
        <div><div style="font-size:22px;font-weight:bold;color:#0F1E3D;">${presupuestosPendientes}</div><div style="font-size:12px;font-family:Arial,sans-serif;color:#666;">Presupuestos pendientes</div></div>
        <div><div style="font-size:22px;font-weight:bold;color:#0F1E3D;">${eventosSemana}</div><div style="font-size:12px;font-family:Arial,sans-serif;color:#666;">Eventos esta semana</div></div>
      </div>
    `;
  } catch (err) {
    box.innerHTML = '';
  }
}

async function exportarBackup() {
  const aviso = document.getElementById('avisoBackup');
  aviso.innerHTML = '<div class="aviso ok">Generando backup, puede tardar unos segundos...</div>';
  try {
    const clientesSnap = await getDocs(collection(db, 'clientes'));
    const clientesData = [];
    for (const cDoc of clientesSnap.docs) {
      const cData = { uid: cDoc.id, ...cDoc.data() };
      const [novSnap, arcSnap, msgSnap] = await Promise.all([
        getDocs(collection(db, 'clientes', cDoc.id, 'novedades')),
        getDocs(collection(db, 'clientes', cDoc.id, 'archivos')),
        getDocs(collection(db, 'clientes', cDoc.id, 'mensajes'))
      ]);
      cData.novedades = novSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      cData.archivos = arcSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      cData.mensajes = msgSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      clientesData.push(cData);
    }
    const agendaSnap = await getDocs(collection(db, 'agenda'));
    const agendaData = agendaSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    const backup = { generadoEl: new Date().toISOString(), clientes: clientesData, agenda: agendaData };
    const backupTexto = JSON.stringify(backup, (key, value) => {
      if (value && typeof value === 'object' && typeof value.seconds === 'number' && typeof value.nanoseconds === 'number') {
        return new Date(value.seconds * 1000).toISOString();
      }
      return value;
    }, 2);

    const blob = new Blob([backupTexto], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backup-portal-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    aviso.innerHTML = '<div class="aviso ok">Backup descargado correctamente.</div>';
  } catch (err) {
    aviso.innerHTML = '<div class="aviso error">Error al generar backup: ' + err.message + '</div>';
  }
}

function dibujarListaClientes(filtro) {
  const listaCont = document.getElementById('listaClientes');
  if (!listaCont) return;
  const texto = filtro.trim().toLowerCase();
  const lista = texto
    ? cacheClientes.filter(c =>
        nombreCompleto(c).toLowerCase().includes(texto) ||
        (c.dni || '').toLowerCase().includes(texto)
      )
    : cacheClientes;

  if (lista.length === 0) {
    listaCont.innerHTML = '<p style="font-family:Arial;font-size:13px;color:#888;margin-top:12px;">No se encontraron clientes.</p>';
    return;
  }

  listaCont.innerHTML = lista.map(c => `
    <div class="caja fila-cliente${c.tieneNuevo ? ' clienteNuevo' : ''}" data-uid="${c.uid}">
      <h3>${esc(nombreCompleto(c)) || '(sin nombre)'}${c.tieneNuevo ? ' <span class="badgeNuevo">● Nuevo</span>' : ''}</h3>
      <p>${esc(etiquetaDocumento(c)) || 'Sin documento'} · Tel: ${esc(c.telefono) || '-'}<br>
      ${[c.localidad, c.provincia].filter(Boolean).map(esc).join(', ')}${c.fechaNacimiento ? ' · Nac: ' + esc(formatearFecha(c.fechaNacimiento)) : ''}<br>
      ${esc(c.email) || ''}</p>
      <div class="detalleCliente oculto" style="margin-top:10px;"></div>
    </div>
  `).join('');

  listaCont.querySelectorAll('.fila-cliente').forEach(el => {
    el.addEventListener('click', async (e) => {
      if (e.target.closest('.detalleCliente')) return;
      const detalle = el.querySelector('.detalleCliente');
      const yaAbierto = !detalle.classList.contains('oculto');
      listaCont.querySelectorAll('.detalleCliente').forEach(d => d.classList.add('oculto'));
      if (el.classList.contains('clienteNuevo')) {
        el.classList.remove('clienteNuevo');
        const badge = el.querySelector('.badgeNuevo');
        if (badge) badge.remove();
        const cLocal = cacheClientes.find(x => x.uid === el.dataset.uid);
        if (cLocal) cLocal.tieneNuevo = false;
        setDoc(doc(db, 'clientes', el.dataset.uid), { tieneNuevo: false, fechaVistaAdmin: serverTimestamp() }, { merge: true }).catch(() => {});
        revisarMensajesNuevos();
      }
      if (yaAbierto) return;
      detalle.classList.remove('oculto');
      detalle.innerHTML = 'Cargando...';
      await renderDetalleCliente(el.dataset.uid, detalle);
    });
  });
}


async function renderDetalleCliente(uid, contenedor) {
  try {
    const c = cacheClientes.find(x => x.uid === uid) || {};
    const filasDatos = [
      ['Nacionalidad', c.nacionalidad],
      ['CUIT/CUIL', c.cuit],
      ['Estado civil', c.estadoCivil],
      ['Ocupación', c.ocupacion],
      ['Dirección', [c.direccion, c.codigoPostal].filter(Boolean).join(' - ')],
      ['Área de consulta', c.areaConsulta],
      ['Contacto de referencia', [c.contactoNombre, c.contactoTelefono].filter(Boolean).join(' - ')],
      ['Cómo nos conoció', c.comoConocio]
    ].filter(([, valor]) => valor);

    const htmlDatos = filasDatos.length
      ? `<div class="caja"><h3 style="margin-bottom:6px;">Datos del cliente</h3>` +
        filasDatos.map(([label, valor]) => `<p style="font-family:Arial;font-size:13px;margin-top:4px;"><strong>${esc(label)}:</strong> ${esc(valor)}</p>`).join('') +
        `</div>`
      : '';

    const [novSnap, arcSnap, msgSnap, presSnap, autSnap, notasSnap] = await Promise.all([
      getDocs(query(collection(db, 'clientes', uid, 'novedades'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'archivos'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'mensajes'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'presupuestos'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'autorizaciones'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'notasPrivadas'), orderBy('fecha', 'desc')))
    ]);
    let items = [];
    novSnap.forEach(d => items.push({ tipo: 'Nota', id: d.id, ...d.data() }));
    arcSnap.forEach(d => items.push({ tipo: 'Archivo', id: d.id, ...d.data() }));
    items.sort((a, b) => (b.fecha?.seconds || 0) - (a.fecha?.seconds || 0));

    let htmlItems = items.length === 0
      ? '<p style="font-size:13px;color:#888;font-family:Arial;">Sin novedades todavía.</p>'
      : items.map(it => {
          const fecha = it.fecha ? new Date(it.fecha.seconds * 1000).toLocaleString('es-AR') : '';
          const coleccion = it.tipo === 'Archivo' ? 'archivos' : 'novedades';
          const botonBorrar = `<span class="btnBorrarItem" data-uid="${uid}" data-coleccion="${coleccion}" data-id="${it.id}" style="float:right;cursor:pointer;color:#b32424;">🗑️</span>`;
          if (it.tipo === 'Archivo') {
            return `<div class="lista-item">📎 <a href="${it.url}" target="_blank">${esc(it.nombre)}</a>${htmlPreviewArchivo(it.nombre, it.url)}${botonBorrar}<small>${fecha}</small></div>`;
          }
          return `<div class="lista-item">💬 ${esc(it.texto)}${botonBorrar}<small>${fecha}</small></div>`;
        }).join('');

    let htmlMsgs = '';
    msgSnap.forEach(d => {
      const m = d.data();
      const fecha = m.fecha ? new Date(m.fecha.seconds * 1000).toLocaleString('es-AR') : '';
      htmlMsgs += `<div class="lista-item mensajeAbogado">💬 ${esc(m.texto || '')}${m.archivoUrl ? '<br>📎 <a href="' + m.archivoUrl + '" target="_blank">' + esc(m.archivoNombre) + '</a>' + htmlPreviewArchivo(m.archivoNombre, m.archivoUrl) : ''}<small>${fecha}</small></div>`;
    });

    let htmlPresupuestos = '';
    presSnap.forEach(d => {
      const p = d.data();
      const fecha = p.fecha ? new Date(p.fecha.seconds * 1000).toLocaleDateString('es-AR') : '';
      const estados = { pendiente: '⏳ Pendiente', aceptado: '✅ Aceptado', rechazado: '❌ Rechazado' };
      const botonBorrar = `<span class="btnBorrarItem" data-uid="${uid}" data-coleccion="presupuestos" data-id="${d.id}" style="float:right;cursor:pointer;color:#b32424;">🗑️</span>`;
      let infoPago = '';
      if (p.estado === 'aceptado') {
        infoPago = p.pagado
          ? ' · 💰 Pagado'
          : ` · <span class="btnMarcarPagado" data-uid="${uid}" data-id="${d.id}" style="cursor:pointer;color:#1e7a34;text-decoration:underline;">Marcar como pagado</span>`;
      }
      htmlPresupuestos += `<div class="lista-item"><strong>${esc(formatearMonto(p.monto))}</strong> — ${esc(p.descripcion)}${botonBorrar}<small>${fecha} · ${estados[p.estado] || p.estado}${infoPago}</small></div>`;
    });

    let htmlAutorizaciones = '';
    autSnap.forEach(d => {
      const a = d.data();
      const fecha = a.fecha ? new Date(a.fecha.seconds * 1000).toLocaleDateString('es-AR') : '';
      const estado = a.estado === 'firmado' ? '✅ Firmado' : '⏳ Pendiente de firma';
      const botonBorrar = `<span class="btnBorrarItem" data-uid="${uid}" data-coleccion="autorizaciones" data-id="${d.id}" style="float:right;cursor:pointer;color:#b32424;">🗑️</span>`;
      htmlAutorizaciones += `<div class="lista-item"><strong>${esc(a.titulo)}</strong>${botonBorrar}<small>${fecha} · ${estado}</small></div>`;
    });

    let htmlNotasPrivadas = '';
    notasSnap.forEach(d => {
      const n = d.data();
      const fecha = n.fecha ? new Date(n.fecha.seconds * 1000).toLocaleString('es-AR') : '';
      const botonBorrar = `<span class="btnBorrarItem" data-uid="${uid}" data-coleccion="notasPrivadas" data-id="${d.id}" style="float:right;cursor:pointer;color:#b32424;">🗑️</span>`;
      htmlNotasPrivadas += `<div class="lista-item" style="background:#FFF4E0;border-radius:6px;padding:8px;border-bottom:none;margin-bottom:6px;">📌 ${esc(n.texto)}${botonBorrar}<small>${fecha}</small></div>`;
    });

    contenedor.innerHTML = `
      ${htmlDatos}
      <div class="caja" style="background:#FFFBF2;border-color:#F0DDA8;">
        <h3 style="margin-bottom:6px;">📌 Notas privadas (solo vos las ves, el cliente no)</h3>
        <div>${htmlNotasPrivadas || '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no dejaste notas privadas sobre este cliente.</p>'}</div>
        <label style="margin-top:10px;">Agregar nota privada</label>
        <textarea class="txtNotaPrivada" placeholder="Ej: Llamó a preguntar por el trámite, pidió reagendar la audiencia, etc."></textarea>
        <button class="chica btnAgregarNota" data-uid="${uid}" style="width:auto;">Guardar nota privada</button>
        <div class="avisoNota"></div>
      </div>
      <button class="chica btnExportarPDF" data-uid="${uid}" style="width:auto;">📄 Exportar ficha en PDF</button>
      <h3 style="margin-bottom:6px;margin-top:16px;">Historial</h3>
      ${htmlItems}
      <h3 style="margin-top:14px;margin-bottom:6px;">Mensajes que le enviaste</h3>
      <div>${htmlMsgs || '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no le enviaste mensajes.</p>'}</div>
      <label style="margin-top:12px;">Enviar un mensaje o archivo a este cliente</label>
      <textarea class="txtMsgAdmin" placeholder="Mensaje (opcional si adjuntás un archivo)"></textarea>
      <label>Adjuntar archivo (opcional)</label>
      <input type="file" class="archivoMsgAdmin">
      <button class="chica btnEnviarMsgAdmin" data-uid="${uid}">Enviar mensaje</button>
      <div class="avisoMsgAdmin"></div>

      <h3 style="margin-top:20px;margin-bottom:6px;">Presupuestos / Honorarios</h3>
      <div>${htmlPresupuestos || '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no le enviaste presupuestos.</p>'}</div>
      <label style="margin-top:10px;">Descripción</label>
      <textarea class="txtPresupuestoDesc" placeholder="Ej: Honorarios por representación en demanda laboral"></textarea>
      <label>Monto ($)</label>
      <input type="number" class="inputPresupuestoMonto" min="0" step="0.01">
      <button class="chica btnEnviarPresupuesto" data-uid="${uid}">Enviar presupuesto</button>
      <div class="avisoPresupuesto"></div>

      <h3 style="margin-top:20px;margin-bottom:6px;">Autorizaciones</h3>
      <div>${htmlAutorizaciones || '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no le enviaste autorizaciones.</p>'}</div>
      <label style="margin-top:10px;">Título</label>
      <input type="text" class="inputAutorizacionTitulo" placeholder="Ej: Autorización para retirar documentación">
      <label>Texto de la autorización</label>
      <textarea class="txtAutorizacionTexto" placeholder="Escribí el texto completo. El cliente va a poder completar el nombre y DNI de la persona autorizada (si corresponde) antes de confirmar."></textarea>
      <button class="chica btnEnviarAutorizacion" data-uid="${uid}">Enviar autorización</button>
      <div class="avisoAutorizacion"></div>

      <button class="chica btnEliminarCliente" data-uid="${uid}" style="background:#b32424;color:#fff;margin-top:20px;">🗑️ Eliminar cliente</button>
      <div class="avisoEliminarCliente"></div>
    `;

    contenedor.querySelector('.btnEliminarCliente').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.target;
      const aviso = contenedor.querySelector('.avisoEliminarCliente');
      const primeraConfirmacion = confirm('¿Eliminar a este cliente? Se van a borrar su ficha, novedades, archivos y mensajes. Esta acción no se puede deshacer.');
      if (!primeraConfirmacion) return;
      const segundaConfirmacion = confirm('Confirmá de nuevo: esto es permanente. ¿Eliminar de todas formas?');
      if (!segundaConfirmacion) return;
      aviso.innerHTML = '<div class="aviso ok">Eliminando...</div>';
      try {
        const u = btn.dataset.uid;
        const [novSnap2, arcSnap2, msgSnap2, notasSnap2] = await Promise.all([
          getDocs(collection(db, 'clientes', u, 'novedades')),
          getDocs(collection(db, 'clientes', u, 'archivos')),
          getDocs(collection(db, 'clientes', u, 'mensajes')),
          getDocs(collection(db, 'clientes', u, 'notasPrivadas'))
        ]);
        const borrados = [];
        novSnap2.forEach(d => borrados.push(deleteDoc(doc(db, 'clientes', u, 'novedades', d.id))));
        arcSnap2.forEach(d => borrados.push(deleteDoc(doc(db, 'clientes', u, 'archivos', d.id))));
        msgSnap2.forEach(d => borrados.push(deleteDoc(doc(db, 'clientes', u, 'mensajes', d.id))));
        notasSnap2.forEach(d => borrados.push(deleteDoc(doc(db, 'clientes', u, 'notasPrivadas', d.id))));
        await Promise.all(borrados);
        await deleteDoc(doc(db, 'clientes', u));
        cacheClientes = cacheClientes.filter(c => c.uid !== u);
        contenedor.closest('.fila-cliente')?.remove();
      } catch (err) {
        aviso.innerHTML = '<div class="aviso error">Error al eliminar: ' + err.message + '</div>';
      }
    });

    contenedor.querySelectorAll('.btnBorrarItem').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        const ok = confirm('¿Borrar este item? No se puede deshacer.');
        if (!ok) return;
        const { uid: u, coleccion, id } = el.dataset;
        try {
          await deleteDoc(doc(db, 'clientes', u, coleccion, id));
          renderDetalleCliente(u, contenedor);
        } catch (err) {
          alert('Error al borrar: ' + err.message);
        }
      });

    contenedor.querySelectorAll('.btnMarcarPagado').forEach(el => {

            pagado: true, fechaPago: serverTimestamp()
          }, { merge: true });
          renderDetalleCliente(uid, contenedor);
        } catch (err) {
          alert('Error: ' + err.message);
        }
      });

    contenedor.querySelector('.btnEnviarMsgAdmin').addEventListener('click', async (e) => {

      const inputArchivo = contenedor.querySelector('.archivoMsgAdmin');
      const archivo = inputArchivo.files[0];
      const aviso = contenedor.querySelector('.avisoMsgAdmin');
      if (!texto && !archivo) { aviso.innerHTML = '<div class="aviso error">Escribí un mensaje o adjuntá un archivo.</div>'; return; }
      aviso.innerHTML = '<div class="aviso ok">Enviando...</div>';
      try {
        let archivoUrl = null, archivoNombre = null;
        if (archivo) {
          const refArchivo = ref(storage, 'clientes/' + btn.dataset.uid + '/admin_' + Date.now() + '_' + archivo.name);
          await uploadBytes(refArchivo, archivo);
          archivoUrl = await getDownloadURL(refArchivo);
          archivoNombre = archivo.name;
        }
        const datosMsg = { texto: texto || '', fecha: serverTimestamp() };
        if (archivoUrl) { datosMsg.archivoUrl = archivoUrl; datosMsg.archivoNombre = archivoNombre; }
        await addDoc(collection(db, 'clientes', btn.dataset.uid, 'mensajes'), datosMsg);
        aviso.innerHTML = '<div class="aviso ok">Mensaje enviado.</div>';
        contenedor.querySelector('.txtMsgAdmin').value = '';
        inputArchivo.value = '';
        renderDetalleCliente(uid, contenedor);
      } catch (err) {
        aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';
      }
    });

    contenedor.querySelector('.btnEnviarPresupuesto').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.target;
      const descripcion = contenedor.querySelector('.txtPresupuestoDesc').value.trim();
      const monto = contenedor.querySelector('.inputPresupuestoMonto').value;
      const aviso = contenedor.querySelector('.avisoPresupuesto');
      if (!descripcion || !monto) { aviso.innerHTML = '<div class="aviso error">Completá la descripción y el monto.</div>'; return; }
      aviso.innerHTML = '<div class="aviso ok">Enviando...</div>';
      try {
        await addDoc(collection(db, 'clientes', btn.dataset.uid, 'presupuestos'), {
          descripcion, monto: Number(monto), estado: 'pendiente', fecha: serverTimestamp()
        });
        await setDoc(doc(db, 'clientes', btn.dataset.uid), { tieneNuevo: true }, { merge: true });
        aviso.innerHTML = '<div class="aviso ok">Presupuesto enviado.</div>';
        renderDetalleCliente(uid, contenedor);
      } catch (err) {
        aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';
      }
    });

    contenedor.querySelector('.btnEnviarAutorizacion').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.target;
      const titulo = contenedor.querySelector('.inputAutorizacionTitulo').value.trim();
      const texto = contenedor.querySelector('.txtAutorizacionTexto').value.trim();
      const aviso = contenedor.querySelector('.avisoAutorizacion');
      if (!titulo || !texto) { aviso.innerHTML = '<div class="aviso error">Completá el título y el texto.</div>'; return; }
      aviso.innerHTML = '<div class="aviso ok">Enviando...</div>';
      try {
        await addDoc(collection(db, 'clientes', btn.dataset.uid, 'autorizaciones'), {
          titulo, texto, estado: 'pendiente', fecha: serverTimestamp()
        });
        await setDoc(doc(db, 'clientes', btn.dataset.uid), { tieneNuevo: true }, { merge: true });
        aviso.innerHTML = '<div class="aviso ok">Autorización enviada.</div>';
        renderDetalleCliente(uid, contenedor);
      } catch (err) {
        aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';
      }
    });

    contenedor.querySelector('.btnAgregarNota').addEventListener('click', async (e) => {

      const aviso = contenedor.querySelector('.avisoNota');
      if (!texto) { aviso.innerHTML = '<div class="aviso error">Escribí una nota antes de guardar.</div>'; return; }
      aviso.innerHTML = '<div class="aviso ok">Guardando...</div>';

          texto, fecha: serverTimestamp()

        renderDetalleCliente(uid, contenedor);

        aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';

      const fechaHoy = new Date().toLocaleDateString('es-AR');

        ? '<p class="vacio">Sin novedades registradas.</p>'
        : items.map(it => {
            const fecha = it.fecha ? new Date(it.fecha.seconds * 1000).toLocaleString('es-AR') : '';
            return it.tipo === 'Archivo'
              ? `<p>📎 ${esc(it.nombre)} <span class="fechaItem">(${fecha})</span></p>`
              : `<p>💬 ${esc(it.texto)} <span class="fechaItem">(${fecha})</span></p>`;
          }).join('');

        mensajesHtml += `<p>💬 ${esc(m.texto || '')} <span class="fechaItem">(${fecha})</span></p>`;
      });
      if (!mensajesHtml) mensajesHtml = '<p class="vacio">Sin mensajes enviados.</p>';

      let presupuestosHtml = '';
      presSnap.forEach(d => {
        const p = d.data();
        const fecha = p.fecha ? new Date(p.fecha.seconds * 1000).toLocaleDateString('es-AR') : '';
        const estados = { pendiente: 'Pendiente', aceptado: 'Aceptado', rechazado: 'Rechazado' };
        presupuestosHtml += `<p>${esc(formatearMonto(p.monto))} — ${esc(p.descripcion)} <span class="fechaItem">(${fecha} · ${estados[p.estado] || p.estado}${p.pagado ? ' · Pagado' : ''})</span></p>`;
      });
      if (!presupuestosHtml) presupuestosHtml = '<p class="vacio">Sin presupuestos enviados.</p>';

      let autorizacionesHtml = '';
      autSnap.forEach(d => {
        const a = d.data();
        const fecha = a.fecha ? new Date(a.fecha.seconds * 1000).toLocaleDateString('es-AR') : '';
        const estado = a.estado === 'firmado' ? 'Firmado' : 'Pendiente de firma';
        autorizacionesHtml += `<p><strong>${esc(a.titulo)}</strong> <span class="fechaItem">(${fecha} · ${estado})</span></p>`;
      });
      if (!autorizacionesHtml) autorizacionesHtml = '<p class="vacio">Sin autorizaciones enviadas.</p>';

      let notasHtml = '';
      notasSnap.forEach(d => {
        const n = d.data();
        const fecha = n.fecha ? new Date(n.fecha.seconds * 1000).toLocaleString('es-AR') : '';
        notasHtml += `<p>📌 ${esc(n.texto)} <span class="fechaItem">(${fecha})</span></p>`;

      if (!notasHtml) notasHtml = '<p class="vacio">Sin notas privadas.</p>';

<style>
  body { font-family: Arial, sans-serif; font-size: 13px; color: #222; padding: 30px; max-width: 800px; margin: 0 auto; }
  h1 { font-size: 20px; color: #0F1E3D; border-bottom: 2px solid #0F1E3D; padding-bottom: 8px; }

  .vacio { color: #888; font-style: italic; }
  .encabezadoFicha { font-size: 12px; color: #666; margin-bottom: 20px; }
  @media print { body { padding: 10px; } }
</style></head>
<body>
  <h1>Estudio Jurídico - Ficha de Cliente</h1>
  <p class="encabezadoFicha">Generado el ${fechaHoy}</p>
  <h2>${esc(nombreCompleto(c)) || '(sin nombre)'}</h2>
  <p><strong>${esc((c.tipoDocumento || 'DNI'))}:</strong> ${esc(c.dni) || '-'} ${c.cuit ? '· <strong>CUIT/CUIL:</strong> ' + esc(c.cuit) : ''}</p>
  <p><strong>Teléfono:</strong> ${esc(c.telefono) || '-'} · <strong>Email:</strong> ${esc(c.email) || '-'}</p>
  ${c.localidad || c.provincia ? '<p><strong>Localidad:</strong> ' + esc([c.localidad, c.provincia].filter(Boolean).join(', ')) + '</p>' : ''}
  ${filasHtml}
  <h2>Historial</h2>
  ${historialHtml}
  <h2>Mensajes enviados al cliente</h2>
  ${mensajesHtml}
  <h2>Presupuestos / Honorarios</h2>
  ${presupuestosHtml}
  <h2>Autorizaciones</h2>
  ${autorizacionesHtml}
  <h2>Notas privadas del estudio</h2>
  ${notasHtml}
</body></html>`;

      const ventana = window.open('', '_blank');
      if (!ventana) {
        alert('El navegador bloqueó la ventana de impresión. Habilitá las ventanas emergentes para este sitio e intentá de nuevo.');
        return;
      }
      ventana.document.write(htmlFicha);
      ventana.document.close();
      ventana.focus();
      setTimeout(() => ventana.print(), 300);
    });
  } catch (err) {
    contenedor.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error: ' + err.message + '</p>';
  }
}

      <input type="date" id="agFecha">
      <label>Título</label>
      <input type="text" id="agTitulo" placeholder="Ej: Audiencia, vencimiento, reunión...">
      <label>Cliente relacionado (opcional)</label>
      <select id="agCliente">
        <option value="">Sin cliente asociado</option>
        ${cacheClientes.map(c => `<option value="${c.uid}">${esc(nombreCompleto(c))}</option>`).join('')}
      </select>
      <label>Nota</label>
      <textarea id="agNota" placeholder="Detalles adicionales..."></textarea>
      <button id="btnAgregarEvento">Guardar evento</button>
      <div id="avisoAgenda"></div>
    </div>

    <div class="caja">
      <div style="display:flex;justify-content:space-between;align-items:center;font-family:Arial;">
        <button class="chica" id="mesAnterior" style="width:auto;margin:0;padding:6px 12px;">←</button>
        <h3 id="tituloMes"></h3>
        <button class="chica" id="mesSiguiente" style="width:auto;margin:0;padding:6px 12px;">→</button>
      </div>
      <div class="calendario" id="calendarioGrid"></div>
    </div>

    <div class="caja">
      <h3>Próximos eventos</h3>
      <label>Buscar por cliente</label>
      <input type="text" id="filtroEventoCliente" placeholder="Nombre del cliente...">
      <div style="display:flex;gap:8px;">
        <div style="flex:1;">
          <label>Desde</label>
          <input type="date" id="filtroEventoDesde">
        </div>
        <div style="flex:1;">
          <label>Hasta</label>
          <input type="date" id="filtroEventoHasta">
        </div>
      </div>
      <div id="listaEventos" style="margin-top:8px;">Cargando...</div>
    </div>
  `;

  document.getElementById('btnAgregarEvento').onclick = async () => {
    const fecha = document.getElementById('agFecha').value;
    const titulo = document.getElementById('agTitulo').value.trim();
    const clienteUid = document.getElementById('agCliente').value;
    const nota = document.getElementById('agNota').value.trim();
    const aviso = document.getElementById('avisoAgenda');
    if (!fecha || !titulo) { aviso.innerHTML = '<div class="aviso error">Completá fecha y título.</div>'; return; }
    aviso.innerHTML = '<div class="aviso ok">Guardando...</div>';
    try {
      const clienteObj = clienteUid ? cacheClientes.find(c => c.uid === clienteUid) : null;
      const clienteNombre = clienteObj ? nombreCompleto(clienteObj) : '';
      const clienteTelefono = clienteObj ? (clienteObj.telefono || '') : '';
      await addDoc(collection(db, 'agenda'), {
        fecha, titulo, nota, clienteUid, clienteNombre, clienteTelefono,
        fechaCreacion: serverTimestamp()
      });
      aviso.innerHTML = '<div class="aviso ok">Evento guardado.</div>';
      document.getElementById('agTitulo').value = '';
      document.getElementById('agNota').value = '';
      cargarCalendario();
      cargarListaEventos();
    } catch (err) {
      aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';
    }
  };

  document.getElementById('mesAnterior').onclick = () => { mesActual.setMonth(mesActual.getMonth() - 1); cargarCalendario(); };
  document.getElementById('mesSiguiente').onclick = () => { mesActual.setMonth(mesActual.getMonth() + 1); cargarCalendario(); };

  document.getElementById('filtroEventoCliente').addEventListener('input', () => cargarListaEventos());
  document.getElementById('filtroEventoDesde').addEventListener('change', () => cargarListaEventos());
  document.getElementById('filtroEventoHasta').addEventListener('change', () => cargarListaEventos());

  await cargarCalendario();
  await cargarListaEventos();
}

async function obtenerTodosLosEventos() {
  const snap = await getDocs(collection(db, 'agenda'));
  let eventos = [];
  snap.forEach(d => eventos.push({ id: d.id, ...d.data() }));
  return eventos;
}

async function cargarCalendario() {
  const grid = document.getElementById('calendarioGrid');
  const titulo = document.getElementById('tituloMes');
  if (!grid) return;

  const nombresMeses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  titulo.textContent = nombresMeses[mesActual.getMonth()] + ' ' + mesActual.getFullYear();

  const eventos = await obtenerTodosLosEventos();
  const fechasConEvento = new Set(eventos.map(e => e.fecha));

  const primerDia = new Date(mesActual.getFullYear(), mesActual.getMonth(), 1);
  const ultimoDia = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0);
  const diaSemanaInicio = primerDia.getDay();
  const hoyStr = new Date().toISOString().slice(0, 10);

  let html = ['D','L','M','M','J','V','S'].map(d => `<div class="diaSemana">${d}</div>`).join('');
  for (let i = 0; i < diaSemanaInicio; i++) html += '<div></div>';
  for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
    const fechaStr = mesActual.getFullYear() + '-' + String(mesActual.getMonth() + 1).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
    const clases = ['diaCal'];
    if (fechaStr === hoyStr) clases.push('hoy');
    if (fechasConEvento.has(fechaStr)) clases.push('conEvento');
    html += `<div class="${clases.join(' ')}">${dia}</div>`;
  }
  grid.innerHTML = html;
}

// ---------- WHATSAPP: armar link con mensaje precargado ----------
function linkWhatsapp(telefono, mensaje) {
  const digitos = (telefono || '').replace(/\D/g, '');
  if (!digitos) return null;
  const numero = digitos.startsWith('54') ? digitos : '549' + digitos.replace(/^0/, '');
  return 'https://wa.me/' + numero + '?text=' + encodeURIComponent(mensaje);
}

async function cargarListaEventos() {
  const cont = document.getElementById('listaEventos');
  if (!cont) return;
  try {
    const eventos = await obtenerTodosLosEventos();
    const hoyStr = new Date().toISOString().slice(0, 10);
    let futuros = eventos.filter(e => e.fecha >= hoyStr).sort((a, b) => a.fecha.localeCompare(b.fecha));

    const inputCliente = document.getElementById('filtroEventoCliente');
    const inputDesde = document.getElementById('filtroEventoDesde');
    const inputHasta = document.getElementById('filtroEventoHasta');
    const textoCliente = inputCliente ? inputCliente.value.trim().toLowerCase() : '';
    const desde = inputDesde ? inputDesde.value : '';
    const hasta = inputHasta ? inputHasta.value : '';

    if (textoCliente) futuros = futuros.filter(e => (e.clienteNombre || '').toLowerCase().includes(textoCliente));
    if (desde) futuros = futuros.filter(e => e.fecha >= desde);
    if (hasta) futuros = futuros.filter(e => e.fecha <= hasta);

    if (futuros.length === 0) {
      cont.innerHTML = '<p style="font-size:13px;color:#888;font-family:Arial;">No hay eventos que coincidan con la búsqueda.</p>';
      return;
    }
    cont.innerHTML = futuros.map(e => {
      const [y, m, d] = e.fecha.split('-');
      let botonWa = '';
      if (e.clienteTelefono) {
        const mensaje = `Hola ${e.clienteNombre || ''}, le recuerdo desde el estudio del Dr. Diego Mayorga: ${e.titulo} el ${d}/${m}/${y}.`;
        const link = linkWhatsapp(e.clienteTelefono, mensaje);
        if (link) botonWa = ` <a href="${link}" target="_blank" style="color:#1ea952;text-decoration:none;">📲 WhatsApp</a>`;
      }
      const botonBorrar = ` <span class="btnBorrarEvento" data-id="${e.id}" style="float:right;cursor:pointer;color:#b32424;">🗑️</span>`;
      return `<div class="lista-item">${botonBorrar}📅 <strong>${d}/${m}/${y}</strong> — ${esc(e.titulo)}${e.clienteNombre ? ' (' + esc(e.clienteNombre) + ')' : ''}${botonWa}${e.nota ? '<br><span style="color:#666;">' + esc(e.nota) + '</span>' : ''}</div>`;
    }).join('');

    cont.querySelectorAll('.btnBorrarEvento').forEach(el => {
      el.addEventListener('click', async () => {
        const ok = confirm('¿Borrar este evento de la agenda? No se puede deshacer.');
        if (!ok) return;
        try {
          await deleteDoc(doc(db, 'agenda', el.dataset.id));
          cargarCalendario();
          cargarListaEventos();
        } catch (err) {
          alert('Error al borrar: ' + err.message);
        }
      });
    });
  } catch (err) {
    cont.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error: ' + err.message + '</p>';
  }
}

async function revisarAlertasHoy() {
  const box = document.getElementById('alertaHoyBox');
  if (!box) return;
  try {
    const eventos = await obtenerTodosLosEventos();
    const hoyStr = new Date().toISOString().slice(0, 10);
    const deHoy = eventos.filter(e => e.fecha === hoyStr);
    if (deHoy.length > 0) {
      box.innerHTML = `<div class="alertaHoy">⚠️ Tenés ${deHoy.length} evento${deHoy.length > 1 ? 's' : ''} agendado${deHoy.length > 1 ? 's' : ''} para hoy: ${deHoy.map(e => esc(e.titulo)).join(', ')}</div>`;
    }
  } catch (err) {
    box.innerHTML = '';
  }
}

async function revisarProximosVencimientos() {
  const box = document.getElementById('alertaProximosBox');
  if (!box) return;
  try {
    const eventos = await obtenerTodosLosEventos();
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const hoyStr = hoy.toISOString().slice(0, 10);
    const limite = new Date(hoy);
    limite.setDate(limite.getDate() + 3);

    const proximos = eventos
      .filter(e => e.fecha > hoyStr && new Date(e.fecha + 'T00:00:00') <= limite)
      .sort((a, b) => a.fecha.localeCompare(b.fecha));

    if (proximos.length > 0) {
      const items = proximos.map(e => {
        const dias = Math.round((new Date(e.fecha + 'T00:00:00') - hoy) / 86400000);
        return `${esc(e.titulo)} (en ${dias} día${dias > 1 ? 's' : ''})`;
      }).join(', ');
      box.innerHTML = `<div class="alertaHoy" style="background:#FFF4E0;color:#8a5a00;">⏳ Próximos vencimientos: ${items}</div>`;
    } else {
      box.innerHTML = '';
    }
  } catch (err) {
    box.innerHTML = '';
  }
}

async function revisarCumpleañosProximos() {
  const box = document.getElementById('alertaCumpleañosBox');
  if (!box) return;
  try {
    const snap = await getDocs(collection(db, 'clientes'));
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const proximos = [];

    snap.forEach(d => {
      const c = d.data();
      if (!c.fechaNacimiento) return;
      const [, mesStr, diaStr] = c.fechaNacimiento.split('-');
      if (!mesStr || !diaStr) return;
      const mes = parseInt(mesStr, 10) - 1;
      const dia = parseInt(diaStr, 10);
      let proximoCumple = new Date(hoy.getFullYear(), mes, dia);
      if (proximoCumple < hoy) proximoCumple = new Date(hoy.getFullYear() + 1, mes, dia);
      const dias = Math.round((proximoCumple - hoy) / 86400000);
      if (dias <= 7) {
        proximos.push({ nombre: nombreCompleto({ apellido: c.apellido, nombre: c.nombre }), dias });
      }
    });

    proximos.sort((a, b) => a.dias - b.dias);

    if (proximos.length > 0) {
      const items = proximos.map(p => `${esc(p.nombre) || '(sin nombre)'} (${p.dias === 0 ? 'hoy' : 'en ' + p.dias + ' día' + (p.dias > 1 ? 's' : '')})`).join(', ');
      box.innerHTML = `<div class="alertaHoy" style="background:#FBEFFB;color:#7a2e7a;">🎂 Cumpleaños próximos: ${items}</div>`;
    } else {
      box.innerHTML = '';
    }
  } catch (err) {
    box.innerHTML = '';
  }
}

// ---------- CONTROLADOR PRINCIPAL ----------
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    pantallaLogin(false);
    return;
  }

  const mostrarContenido = async () => {
    if (user.email === ADMIN_EMAIL) {
      pantallaAdmin(user);
      return;
    }

    cuerpo.innerHTML = '<div class="carga-inicial" style="color:#0F1E3D;">Cargando tus datos...</div>';
    try {
      const snap = await getDoc(doc(db, 'clientes', user.uid));
      if (snap.exists()) {
        pantallaDashboard(user, snap.data());
      } else {
        pantallaFormulario(user);
      }
    } catch (err) {
      cuerpo.innerHTML = '<div class="aviso error">Error al cargar: ' + err.message + '</div>';
    }
  };

  if (tieneCredencialGuardada()) {
    pantallaBloqueo(mostrarContenido);
  } else {
    mostrarContenido();
  }
});
