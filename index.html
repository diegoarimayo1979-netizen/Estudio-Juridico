// ---------- NOTIFICACIONES PUSH (solo para el administrador) ----------
async function activarNotificaciones(uid) {
  const cajaEstado = document.getElementById('estadoNotif');
  if (!('Notification' in window) || !messaging) {
    if (cajaEstado) cajaEstado.textContent = 'Este navegador no soporta notificaciones.';
    return;
  }
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') {
      if (cajaEstado) cajaEstado.textContent = 'Notificaciones desactivadas. Activalas desde el navegador si querés recibir alertas.';
      return;
    }
    const registro = await navigator.serviceWorker.register('/Estudio-Juridico/firebase-messaging-sw.js');
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registro });
    if (token) {
      await setDoc(doc(db, 'adminTokens', token), {
        uid, fecha: serverTimestamp(), dispositivo: navigator.userAgent
      });
      if (cajaEstado) cajaEstado.textContent = '🔔 Notificaciones activadas en este dispositivo.';
    }
  } catch (err) {
    console.log('No se pudo activar notificaciones:', err.message);
    if (cajaEstado) cajaEstado.textContent = 'No se pudieron activar las notificaciones: ' + err.message;
  }
}

}

    if (Notification.permission === 'granted') {

        body: payload.notification?.body || '',
        icon: 'logo.png'
      });
    }
  });
}

// ---------- PANTALLA: LOGIN / REGISTRO ----------
function pantallaLogin(modoRegistro = false) {
  contenedorPrincipal.classList.remove('ancho');
  cuerpo.innerHTML = `
    <h2>${modoRegistro ? 'Crear tu cuenta' : 'Iniciar sesión'}</h2>
    <label>Email</label>
    <input type="email" id="inEmail" placeholder="tu@email.com">
    <label>Contraseña</label>
    <input type="password" id="inPass" placeholder="Mínimo 6 caracteres">
    <button id="btnAccion">${modoRegistro ? 'Crear cuenta' : 'Ingresar'}</button>
    <div class="enlace-cambio" id="btnCambiar">
      ${modoRegistro ? '¿Ya tenés cuenta? Iniciar sesión' : '¿Primera vez? Crear una cuenta'}
    </div>
    <div id="avisoLogin"></div>
  `;

  document.getElementById('btnCambiar').onclick = () => pantallaLogin(!modoRegistro);

  document.getElementById('btnAccion').onclick = async () => {
    const email = document.getElementById('inEmail').value.trim();
    const pass = document.getElementById('inPass').value;
    const aviso = document.getElementById('avisoLogin');
    if (!email || !pass) {
      aviso.innerHTML = '<div class="aviso error">Completá email y contraseña.</div>';
      return;
    }
    aviso.innerHTML = '<div class="aviso ok">Procesando...</div>';
    try {
      if (modoRegistro) {
        await createUserWithEmailAndPassword(auth, email, pass);
      } else {
        await signInWithEmailAndPassword(auth, email, pass);
      }
    } catch (err) {
      aviso.innerHTML = '<div class="aviso error">' + traducirError(err.code) + '</div>';
    }
  };
}

function traducirError(code) {
  const mapa = {
    'auth/email-already-in-use': 'Ese email ya tiene una cuenta creada. Probá iniciar sesión.',
    'auth/invalid-email': 'El email no es válido.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/invalid-credential': 'Email o contraseña incorrectos.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/user-not-found': 'No existe una cuenta con ese email.'
  };
  return mapa[code] || 'Ocurrió un error. Intentá de nuevo.';
}

      <div id="listaHistorial">Cargando...</div>
    </div>

    <div class="salir" id="btnSalir">Cerrar sesión</div>
  `;

  document.getElementById('btnSalir').onclick = () => signOut(auth);

  document.getElementById('btnNovedad').onclick = async () => {
    const texto = document.getElementById('txtNovedad').value.trim();
    const aviso = document.getElementById('avisoNovedad');
    if (!texto) { aviso.innerHTML = '<div class="aviso error">Escribí algo primero.</div>'; return; }
    aviso.innerHTML = '<div class="aviso ok">Enviando...</div>';
    try {
      await addDoc(collection(db, 'clientes', user.uid, 'novedades'), {
        texto, fecha: serverTimestamp()
      });
      document.getElementById('txtNovedad').value = '';
      aviso.innerHTML = '<div class="aviso ok">Enviado correctamente.</div>';
      cargarHistorial(user.uid);
    } catch (err) {
      aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';
    }
  };

  document.getElementById('btnArchivo').onclick = async () => {
    const input = document.getElementById('archivoInput');
    const aviso = document.getElementById('avisoArchivo');
    if (!input.files.length) { aviso.innerHTML = '<div class="aviso error">Elegí un archivo primero.</div>'; return; }
    const archivo = input.files[0];
    aviso.innerHTML = '<div class="aviso ok">Subiendo...</div>';
    try {
      const refArchivo = ref(storage, 'clientes/' + user.uid + '/' + Date.now() + '_' + archivo.name);
      await uploadBytes(refArchivo, archivo);
      const url = await getDownloadURL(refArchivo);
      await addDoc(collection(db, 'clientes', user.uid, 'archivos'), {
        nombre: archivo.name, url, fecha: serverTimestamp()
      });
      input.value = '';
      aviso.innerHTML = '<div class="aviso ok">Archivo subido correctamente.</div>';
      cargarHistorial(user.uid);
    } catch (err) {
      aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';
    }
  };

  cargarHistorial(user.uid);
  cargarMensajesAbogado(user.uid);
}

async function cargarMensajesAbogado(uid) {
  const cont = document.getElementById('mensajesAbogado');
  if (!cont) return;
  try {
    const snap = await getDocs(query(collection(db, 'clientes', uid, 'mensajes'), orderBy('fecha', 'desc')));
    if (snap.empty) {
      cont.innerHTML = '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no hay mensajes.</p>';
      return;
    }
    let html = '';
    snap.forEach(d => {
      const m = d.data();
      const fecha = m.fecha ? new Date(m.fecha.seconds * 1000).toLocaleString('es-AR') : '';
      html += `<div class="lista-item mensajeAbogado">💬 ${m.texto}<small>${fecha}</small></div>`;
    });
    cont.innerHTML = html;
  } catch (err) {
    cont.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error: ' + err.message + '</p>';
  }
}

async function cargarHistorial(uid) {
  const cont = document.getElementById('listaHistorial');
  if (!cont) return;
  try {
    const [novSnap, arcSnap] = await Promise.all([
      getDocs(query(collection(db, 'clientes', uid, 'novedades'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'archivos'), orderBy('fecha', 'desc')))
    ]);
    let items = [];
    novSnap.forEach(d => items.push({ tipo: 'Nota', ...d.data() }));
    arcSnap.forEach(d => items.push({ tipo: 'Archivo', ...d.data() }));
    items.sort((a, b) => (b.fecha?.seconds || 0) - (a.fecha?.seconds || 0));

    if (items.length === 0) {
      cont.innerHTML = '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no hay novedades.</p>';
      return;
    }
    cont.innerHTML = items.map(it => {
      const fecha = it.fecha ? new Date(it.fecha.seconds * 1000).toLocaleString('es-AR') : '';
      if (it.tipo === 'Archivo') {
        return `<div class="lista-item">📎 <a href="${it.url}" target="_blank">${it.nombre}</a><small>${fecha}</small></div>`;
      }
      return `<div class="lista-item">💬 ${it.texto}<small>${fecha}</small></div>`;
    }).join('');
  } catch (err) {
    cont.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error al cargar: ' + err.message + '</p>';
  }
}

async function renderTabClientes(user) {
  const cont = document.getElementById('contenidoTab');
  cont.innerHTML = 'Cargando clientes...';
  try {
    const snap = await getDocs(collection(db, 'clientes'));
    cacheClientes = [];
    snap.forEach(d => cacheClientes.push({ uid: d.id, ...d.data() }));

    if (cacheClientes.length === 0) {
      cont.innerHTML = '<p style="font-family:Arial;font-size:13px;color:#888;">Todavía no hay clientes registrados.</p>';
      return;
    }

    cont.innerHTML = cacheClientes.map(c => `
      <div class="caja fila-cliente" data-uid="${c.uid}">
        <h3>${c.nombre || '(sin nombre)'}</h3>
        <p>DNI: ${c.dni || '-'} · Tel: ${c.telefono || '-'}<br>${c.email || ''}</p>
        <div class="detalleCliente oculto" style="margin-top:10px;"></div>
      </div>
    `).join('');

    cont.querySelectorAll('.fila-cliente').forEach(el => {
      el.addEventListener('click', async (e) => {
        if (e.target.closest('.detalleCliente')) return;
        const detalle = el.querySelector('.detalleCliente');
        const yaAbierto = !detalle.classList.contains('oculto');
        cont.querySelectorAll('.detalleCliente').forEach(d => d.classList.add('oculto'));
        if (yaAbierto) return;
        detalle.classList.remove('oculto');
        detalle.innerHTML = 'Cargando...';
        await renderDetalleCliente(el.dataset.uid, detalle);
      });
    });
  } catch (err) {
    cont.innerHTML = '<div class="aviso error">Error al cargar clientes: ' + err.message + '</div>';
  }
}

async function renderDetalleCliente(uid, contenedor) {
  try {
    const [novSnap, arcSnap, msgSnap] = await Promise.all([
      getDocs(query(collection(db, 'clientes', uid, 'novedades'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'archivos'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'mensajes'), orderBy('fecha', 'desc')))
    ]);
    let items = [];
    novSnap.forEach(d => items.push({ tipo: 'Nota', ...d.data() }));
    arcSnap.forEach(d => items.push({ tipo: 'Archivo', ...d.data() }));
    items.sort((a, b) => (b.fecha?.seconds || 0) - (a.fecha?.seconds || 0));

    let htmlItems = items.length === 0
      ? '<p style="font-size:13px;color:#888;font-family:Arial;">Sin novedades todavía.</p>'
      : items.map(it => {
          const fecha = it.fecha ? new Date(it.fecha.seconds * 1000).toLocaleString('es-AR') : '';
          if (it.tipo === 'Archivo') {
            return `<div class="lista-item">📎 <a href="${it.url}" target="_blank">${it.nombre}</a><small>${fecha}</small></div>`;
          }
          return `<div class="lista-item">💬 ${it.texto}<small>${fecha}</small></div>`;
        }).join('');

    let htmlMsgs = '';
    msgSnap.forEach(d => {
      const m = d.data();
      const fecha = m.fecha ? new Date(m.fecha.seconds * 1000).toLocaleString('es-AR') : '';
      htmlMsgs += `<div class="lista-item mensajeAbogado">💬 ${m.texto}<small>${fecha}</small></div>`;
    });

    contenedor.innerHTML = `
      <h3 style="margin-bottom:6px;">Historial</h3>
      ${htmlItems}
      <h3 style="margin-top:14px;margin-bottom:6px;">Mensajes que le enviaste</h3>
      <div>${htmlMsgs || '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no le enviaste mensajes.</p>'}</div>
      <label style="margin-top:12px;">Enviar un mensaje a este cliente</label>
      <textarea class="txtMsgAdmin"></textarea>
      <button class="chica btnEnviarMsgAdmin" data-uid="${uid}">Enviar mensaje</button>
      <div class="avisoMsgAdmin"></div>
    `;

    contenedor.querySelector('.btnEnviarMsgAdmin').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.target;
      const texto = contenedor.querySelector('.txtMsgAdmin').value.trim();
      const aviso = contenedor.querySelector('.avisoMsgAdmin');
      if (!texto) { aviso.innerHTML = '<div class="aviso error">Escribí un mensaje primero.</div>'; return; }
      aviso.innerHTML = '<div class="aviso ok">Enviando...</div>';
      try {
        await addDoc(collection(db, 'clientes', btn.dataset.uid, 'mensajes'), {
          texto, fecha: serverTimestamp()
        });
        aviso.innerHTML = '<div class="aviso ok">Mensaje enviado.</div>';
        contenedor.querySelector('.txtMsgAdmin').value = '';
        renderDetalleCliente(uid, contenedor);
      } catch (err) {
        aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';
      }
    });
  } catch (err) {
    contenedor.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error: ' + err.message + '</p>';
  }
}

// ---------- AGENDA ----------
let mesActual = new Date();

async function renderTabAgenda(user) {
  const cont = document.getElementById('contenidoTab');
  cont.innerHTML = `
    <div class="caja">
      <h3>Agregar evento</h3>
      <label>Fecha</label>
      <input type="date" id="agFecha">
      <label>Título</label>
      <input type="text" id="agTitulo" placeholder="Ej: Audiencia, vencimiento, reunión...">
      <label>Cliente relacionado (opcional)</label>
      <select id="agCliente">
        <option value="">Sin cliente asociado</option>
        ${cacheClientes.map(c => `<option value="${c.uid}">${c.nombre}</option>`).join('')}
      </select>
      <label>Nota</label>
      <textarea id="agNota" placeholder="Detalles adicionales..."></textarea>
      <button id="btnAgregarEvento">Guardar evento</button>
      <div id="avisoAgenda"></div>
    </div>

    <div class="caja">
      <div style="display:flex;justify-content:space-between;align-items:center;font-family:Arial;">
        <button class="chica" id="mesAnterior" style="width:auto;margin:0;padding:6px 12px;">←</button>
        <h3 id="tituloMes"></h3>
        <button class="chica" id="mesSiguiente" style="width:auto;margin:0;padding:6px 12px;">→</button>
      </div>
      <div class="calendario" id="calendarioGrid"></div>
    </div>

    <div class="caja">
      <h3>Próximos eventos</h3>
      <div id="listaEventos" style="margin-top:8px;">Cargando...</div>
    </div>
  `;

  document.getElementById('btnAgregarEvento').onclick = async () => {
    const fecha = document.getElementById('agFecha').value;
    const titulo = document.getElementById('agTitulo').value.trim();
    const clienteUid = document.getElementById('agCliente').value;
    const nota = document.getElementById('agNota').value.trim();
    const aviso = document.getElementById('avisoAgenda');
    if (!fecha || !titulo) { aviso.innerHTML = '<div class="aviso error">Completá fecha y título.</div>'; return; }
    aviso.innerHTML = '<div class="aviso ok">Guardando...</div>';
    try {
      const clienteNombre = clienteUid ? (cacheClientes.find(c => c.uid === clienteUid)?.nombre || '') : '';
      await addDoc(collection(db, 'agenda'), {
        fecha, titulo, nota, clienteUid, clienteNombre,
        fechaCreacion: serverTimestamp()
      });
      aviso.innerHTML = '<div class="aviso ok">Evento guardado.</div>';
      document.getElementById('agTitulo').value = '';
      document.getElementById('agNota').value = '';
      cargarCalendario();
      cargarListaEventos();
    } catch (err) {
      aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';
    }
  };

  document.getElementById('mesAnterior').onclick = () => { mesActual.setMonth(mesActual.getMonth() - 1); cargarCalendario(); };
  document.getElementById('mesSiguiente').onclick = () => { mesActual.setMonth(mesActual.getMonth() + 1); cargarCalendario(); };

  await cargarCalendario();
  await cargarListaEventos();
}

async function obtenerTodosLosEventos() {
  const snap = await getDocs(collection(db, 'agenda'));
  let eventos = [];
  snap.forEach(d => eventos.push({ id: d.id, ...d.data() }));
  return eventos;
}

async function cargarCalendario() {
  const grid = document.getElementById('calendarioGrid');
  const titulo = document.getElementById('tituloMes');
  if (!grid) return;

  const nombresMeses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  titulo.textContent = nombresMeses[mesActual.getMonth()] + ' ' + mesActual.getFullYear();

  const eventos = await obtenerTodosLosEventos();
  const fechasConEvento = new Set(eventos.map(e => e.fecha));

  const primerDia = new Date(mesActual.getFullYear(), mesActual.getMonth(), 1);
  const ultimoDia = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0);
  const diaSemanaInicio = primerDia.getDay();
  const hoyStr = new Date().toISOString().slice(0, 10);

  let html = ['D','L','M','M','J','V','S'].map(d => `<div class="diaSemana">${d}</div>`).join('');
  for (let i = 0; i < diaSemanaInicio; i++) html += '<div></div>';
  for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
    const fechaStr = mesActual.getFullYear() + '-' + String(mesActual.getMonth() + 1).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
    const clases = ['diaCal'];
    if (fechaStr === hoyStr) clases.push('hoy');
    if (fechasConEvento.has(fechaStr)) clases.push('conEvento');
    html += `<div class="${clases.join(' ')}">${dia}</div>`;
  }
  grid.innerHTML = html;
}

async function cargarListaEventos() {
  const cont = document.getElementById('listaEventos');
  if (!cont) return;
  try {
    const eventos = await obtenerTodosLosEventos();
    const hoyStr = new Date().toISOString().slice(0, 10);
    const futuros = eventos.filter(e => e.fecha >= hoyStr).sort((a, b) => a.fecha.localeCompare(b.fecha));

    if (futuros.length === 0) {
      cont.innerHTML = '<p style="font-size:13px;color:#888;font-family:Arial;">No hay eventos próximos.</p>';
      return;
    }
    cont.innerHTML = futuros.map(e => {
      const [y, m, d] = e.fecha.split('-');
      return `<div class="lista-item">📅 <strong>${d}/${m}/${y}</strong> — ${e.titulo}${e.clienteNombre ? ' (' + e.clienteNombre + ')' : ''}${e.nota ? '<br><span style="color:#666;">' + e.nota + '</span>' : ''}</div>`;
    }).join('');
  } catch (err) {
    cont.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error: ' + err.message + '</p>';
  }
}

async function revisarAlertasHoy() {
  const box = document.getElementById('alertaHoyBox');
  if (!box) return;
  try {
    const eventos = await obtenerTodosLosEventos();
    const hoyStr = new Date().toISOString().slice(0, 10);
    const deHoy = eventos.filter(e => e.fecha === hoyStr);
    if (deHoy.length > 0) {
      box.innerHTML = `<div class="alertaHoy">⚠️ Tenés ${deHoy.length} evento${deHoy.length > 1 ? 's' : ''} agendado${deHoy.length > 1 ? 's' : ''} para hoy: ${deHoy.map(e => e.titulo).join(', ')}</div>`;
    }
  } catch (err) {
    box.innerHTML = '';
  }
}

// ---------- CONTROLADOR PRINCIPAL ----------
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    pantallaLogin(false);
    return;
  }

  if (user.email === ADMIN_EMAIL) {
    pantallaAdmin(user);
    return;
  }

  cuerpo.innerHTML = '<div class="carga-inicial" style="color:#0F1E3D;">Cargando tus datos...</div>';
  try {
    const snap = await getDoc(doc(db, 'clientes', user.uid));
    if (snap.exists()) {
      pantallaDashboard(user, snap.data());
    } else {
      pantallaFormulario(user);
    }
  } catch (err) {
    cuerpo.innerHTML = '<div class="aviso error">Error al cargar: ' + err.message + '</div>';
  }
});
