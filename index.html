// ---------- SEGURIDAD: neutraliza cualquier código HTML en texto de usuarios ----------
function esc(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ---------- BLOQUEO CON HUELLA / FACE ID (WebAuthn, local al dispositivo) ----------
function tieneCredencialGuardada() {
  return !!localStorage.getItem('bioCredId');
}

async function activarBloqueoHuella() {
  if (!window.PublicKeyCredential) {
    alert('Este navegador no soporta bloqueo con huella o Face ID.');
    return;
  }
  try {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const credential = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'Portal de Clientes - Dr. Diego Mayorga' },
        user: {
          id: userId,
          name: auth.currentUser?.email || 'usuario',
          displayName: auth.currentUser?.email || 'usuario'
        },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000
      }
    });
    const credIdB64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
    localStorage.setItem('bioCredId', credIdB64);
    alert('Bloqueo con huella/Face ID activado en este dispositivo.');
  } catch (err) {
    alert('No se pudo activar el bloqueo: ' + err.message);
  }
}

function desactivarBloqueoHuella() {
  localStorage.removeItem('bioCredId');
  alert('Bloqueo con huella/Face ID desactivado en este dispositivo.');
}

async function pedirDesbloqueoHuella() {
  const credIdB64 = localStorage.getItem('bioCredId');
  if (!credIdB64) return true;
  try {
    const credIdBytes = Uint8Array.from(atob(credIdB64), (c) => c.charCodeAt(0));
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ id: credIdBytes, type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000
      }
    });
    return true;
  } catch (err) {
    return false;
  }
}

// ---------- NOTIFICACIONES PUSH (solo para el administrador) ----------
async function activarNotificaciones(uid) {
  const cajaEstado = document.getElementById('estadoNotif');
  if (!('Notification' in window) || !messaging) {
    if (cajaEstado) cajaEstado.textContent = 'Este navegador no soporta notificaciones.';
    return;
  }
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') {
      if (cajaEstado) cajaEstado.textContent = 'Notificaciones desactivadas. Activalas desde el navegador si querés recibir alertas.';
      return;
    }
    const registro = await navigator.serviceWorker.ready;
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registro });
    if (token) {
      await setDoc(doc(db, 'adminTokens', token), {
        uid, fecha: serverTimestamp(), dispositivo: navigator.userAgent
      });
      if (cajaEstado) cajaEstado.textContent = '🔔 Notificaciones activadas en este dispositivo.';
    }
  } catch (err) {
    console.log('No se pudo activar notificaciones:', err.message);
    if (cajaEstado) cajaEstado.textContent = 'No se pudieron activar las notificaciones: ' + err.message;
  }
}

}

      });
    }
  });

    <label>Contraseña</label>
    <input type="password" id="inPass" placeholder="Mínimo 6 caracteres">
    <button id="btnAccion">${modoRegistro ? 'Crear cuenta' : 'Ingresar'}</button>
    <div class="enlace-cambio" id="btnCambiar">
      ${modoRegistro ? '¿Ya tenés cuenta? Iniciar sesión' : '¿Primera vez? Crear una cuenta'}
    </div>
    <div id="avisoLogin"></div>
    ${htmlCajaInstalar()}
  `;

  wireCajaInstalar();
  document.getElementById('btnCambiar').onclick = () => pantallaLogin(!modoRegistro);

  document.getElementById('inEmailDominio').addEventListener('change', (e) => {
    const inputOtro = document.getElementById('inEmailDominioOtro');
    inputOtro.classList.toggle('oculto', e.target.value !== 'otro');
  });

  document.getElementById('btnAccion').onclick = async () => {
    const usuario = document.getElementById('inEmailUsuario').value.trim();
    const dominioSelect = document.getElementById('inEmailDominio').value;
    const dominioOtro = document.getElementById('inEmailDominioOtro').value.trim();
    const dominio = dominioSelect === 'otro' ? dominioOtro : dominioSelect;
    const email = usuario.includes('@') ? usuario : (usuario && dominio ? `${usuario}@${dominio}` : '');
    const pass = document.getElementById('inPass').value;
    const aviso = document.getElementById('avisoLogin');
    if (!email || !pass) {
      aviso.innerHTML = '<div class="aviso error">Completá email y contraseña.</div>';
      return;
    }
    aviso.innerHTML = '<div class="aviso ok">Procesando...</div>';
    try {
      if (modoRegistro) {
        await createUserWithEmailAndPassword(auth, email, pass);
      } else {
        await signInWithEmailAndPassword(auth, email, pass);
      }
    } catch (err) {
      aviso.innerHTML = '<div class="aviso error">' + traducirError(err.code) + '</div>';
    }
  };
}

function traducirError(code) {
  const mapa = {
    'auth/email-already-in-use': 'Ese email ya tiene una cuenta creada. Probá iniciar sesión.',
    'auth/invalid-email': 'El email no es válido.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/invalid-credential': 'Email o contraseña incorrectos.',
    'auth/wrong-password': 'Contraseña incorrecta.',
    'auth/user-not-found': 'No existe una cuenta con ese email.'
  };
  return mapa[code] || 'Ocurrió un error. Intentá de nuevo.';
}

};

function formatearFecha(fechaStr) {
  if (!fechaStr) return '';
  const [y, m, d] = fechaStr.split('-');
  if (!y || !m || !d) return fechaStr;
  return `${d}/${m}/${y}`;
}

async function cargarMensajesAbogado(uid) {
  const cont = document.getElementById('mensajesAbogado');
  if (!cont) return;
  try {
    const snap = await getDocs(query(collection(db, 'clientes', uid, 'mensajes'), orderBy('fecha', 'desc')));
    if (snap.empty) {
      cont.innerHTML = '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no hay mensajes.</p>';
      return;
    }
    let html = '';
    snap.forEach(d => {
      const m = d.data();
      const fecha = m.fecha ? new Date(m.fecha.seconds * 1000).toLocaleString('es-AR') : '';
      html += `<div class="lista-item mensajeAbogado">💬 ${esc(m.texto || '')}${m.archivoUrl ? '<br>📎 <a href="' + m.archivoUrl + '" target="_blank">' + esc(m.archivoNombre) + '</a>' : ''}<small>${fecha}</small></div>`;
    });
    cont.innerHTML = html;
  } catch (err) {
    cont.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error: ' + err.message + '</p>';
  }
}

async function cargarHistorial(uid) {
  const cont = document.getElementById('listaHistorial');
  if (!cont) return;
  try {
    const [novSnap, arcSnap] = await Promise.all([
      getDocs(query(collection(db, 'clientes', uid, 'novedades'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'archivos'), orderBy('fecha', 'desc')))
    ]);
    let items = [];
    novSnap.forEach(d => items.push({ tipo: 'Nota', ...d.data() }));
    arcSnap.forEach(d => items.push({ tipo: 'Archivo', ...d.data() }));
    items.sort((a, b) => (b.fecha?.seconds || 0) - (a.fecha?.seconds || 0));

    if (items.length === 0) {
      cont.innerHTML = '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no hay novedades.</p>';
      return;
    }
    cont.innerHTML = items.map(it => {
      const fecha = it.fecha ? new Date(it.fecha.seconds * 1000).toLocaleString('es-AR') : '';
      if (it.tipo === 'Archivo') {
        return `<div class="lista-item">📎 <a href="${it.url}" target="_blank">${esc(it.nombre)}</a><small>${fecha}</small></div>`;
      }
      return `<div class="lista-item">💬 ${esc(it.texto)}<small>${fecha}</small></div>`;
    }).join('');
  } catch (err) {
    cont.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error al cargar: ' + err.message + '</p>';
  }
}

async function exportarBackup() {
  const aviso = document.getElementById('avisoBackup');
  aviso.innerHTML = '<div class="aviso ok">Generando backup, puede tardar unos segundos...</div>';
  try {
    const clientesSnap = await getDocs(collection(db, 'clientes'));
    const clientesData = [];
    for (const cDoc of clientesSnap.docs) {
      const cData = { uid: cDoc.id, ...cDoc.data() };
      const [novSnap, arcSnap, msgSnap] = await Promise.all([
        getDocs(collection(db, 'clientes', cDoc.id, 'novedades')),
        getDocs(collection(db, 'clientes', cDoc.id, 'archivos')),
        getDocs(collection(db, 'clientes', cDoc.id, 'mensajes'))
      ]);
      cData.novedades = novSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      cData.archivos = arcSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      cData.mensajes = msgSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      clientesData.push(cData);
    }
    const agendaSnap = await getDocs(collection(db, 'agenda'));
    const agendaData = agendaSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    const backup = { generadoEl: new Date().toISOString(), clientes: clientesData, agenda: agendaData };
    const backupTexto = JSON.stringify(backup, (key, value) => {
      if (value && typeof value === 'object' && typeof value.seconds === 'number' && typeof value.nanoseconds === 'number') {
        return new Date(value.seconds * 1000).toISOString();
      }
      return value;
    }, 2);

    const blob = new Blob([backupTexto], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backup-portal-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    aviso.innerHTML = '<div class="aviso ok">Backup descargado correctamente.</div>';
  } catch (err) {
    aviso.innerHTML = '<div class="aviso error">Error al generar backup: ' + err.message + '</div>';
  }
}

function dibujarListaClientes(filtro) {
  const listaCont = document.getElementById('listaClientes');
  if (!listaCont) return;
  const texto = filtro.trim().toLowerCase();
  const lista = texto
    ? cacheClientes.filter(c =>
        nombreCompleto(c).toLowerCase().includes(texto) ||
        (c.dni || '').toLowerCase().includes(texto)
      )
    : cacheClientes;

  if (lista.length === 0) {
    listaCont.innerHTML = '<p style="font-family:Arial;font-size:13px;color:#888;margin-top:12px;">No se encontraron clientes.</p>';
    return;
  }

  listaCont.innerHTML = lista.map(c => `
    <div class="caja fila-cliente${c.tieneNuevo ? ' clienteNuevo' : ''}" data-uid="${c.uid}">
      <h3>${esc(nombreCompleto(c)) || '(sin nombre)'}${c.tieneNuevo ? ' <span class="badgeNuevo">● Nuevo</span>' : ''}</h3>
      <p>DNI: ${esc(c.dni) || '-'} · Tel: ${esc(c.telefono) || '-'}<br>
      ${[c.localidad, c.provincia].filter(Boolean).map(esc).join(', ')}${c.fechaNacimiento ? ' · Nac: ' + esc(formatearFecha(c.fechaNacimiento)) : ''}<br>
      ${esc(c.email) || ''}</p>
      <div class="detalleCliente oculto" style="margin-top:10px;"></div>
    </div>
  `).join('');

  listaCont.querySelectorAll('.fila-cliente').forEach(el => {
    el.addEventListener('click', async (e) => {
      if (e.target.closest('.detalleCliente')) return;
      const detalle = el.querySelector('.detalleCliente');
      const yaAbierto = !detalle.classList.contains('oculto');
      listaCont.querySelectorAll('.detalleCliente').forEach(d => d.classList.add('oculto'));
      if (el.classList.contains('clienteNuevo')) {
        el.classList.remove('clienteNuevo');
        const badge = el.querySelector('.badgeNuevo');
        if (badge) badge.remove();
        const cLocal = cacheClientes.find(x => x.uid === el.dataset.uid);
        if (cLocal) cLocal.tieneNuevo = false;
        setDoc(doc(db, 'clientes', el.dataset.uid), { tieneNuevo: false }, { merge: true }).catch(() => {});
        revisarMensajesNuevos();
      }
      if (yaAbierto) return;
      detalle.classList.remove('oculto');
      detalle.innerHTML = 'Cargando...';
      await renderDetalleCliente(el.dataset.uid, detalle);
    });
  });
}


async function renderDetalleCliente(uid, contenedor) {
  try {
    const [novSnap, arcSnap, msgSnap] = await Promise.all([
      getDocs(query(collection(db, 'clientes', uid, 'novedades'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'archivos'), orderBy('fecha', 'desc'))),
      getDocs(query(collection(db, 'clientes', uid, 'mensajes'), orderBy('fecha', 'desc')))
    ]);
    let items = [];
    novSnap.forEach(d => items.push({ tipo: 'Nota', id: d.id, ...d.data() }));
    arcSnap.forEach(d => items.push({ tipo: 'Archivo', id: d.id, ...d.data() }));
    items.sort((a, b) => (b.fecha?.seconds || 0) - (a.fecha?.seconds || 0));

    let htmlItems = items.length === 0
      ? '<p style="font-size:13px;color:#888;font-family:Arial;">Sin novedades todavía.</p>'
      : items.map(it => {
          const fecha = it.fecha ? new Date(it.fecha.seconds * 1000).toLocaleString('es-AR') : '';
          const coleccion = it.tipo === 'Archivo' ? 'archivos' : 'novedades';
          const botonBorrar = `<span class="btnBorrarItem" data-uid="${uid}" data-coleccion="${coleccion}" data-id="${it.id}" style="float:right;cursor:pointer;color:#b32424;">🗑️</span>`;
          if (it.tipo === 'Archivo') {
            return `<div class="lista-item">📎 <a href="${it.url}" target="_blank">${esc(it.nombre)}</a>${botonBorrar}<small>${fecha}</small></div>`;
          }
          return `<div class="lista-item">💬 ${esc(it.texto)}${botonBorrar}<small>${fecha}</small></div>`;
        }).join('');

    let htmlMsgs = '';
    msgSnap.forEach(d => {
      const m = d.data();
      const fecha = m.fecha ? new Date(m.fecha.seconds * 1000).toLocaleString('es-AR') : '';
      htmlMsgs += `<div class="lista-item mensajeAbogado">💬 ${esc(m.texto || '')}${m.archivoUrl ? '<br>📎 <a href="' + m.archivoUrl + '" target="_blank">' + esc(m.archivoNombre) + '</a>' : ''}<small>${fecha}</small></div>`;
    });

    contenedor.innerHTML = `
      <h3 style="margin-bottom:6px;">Historial</h3>
      ${htmlItems}
      <h3 style="margin-top:14px;margin-bottom:6px;">Mensajes que le enviaste</h3>
      <div>${htmlMsgs || '<p style="font-size:13px;color:#888;font-family:Arial;">Todavía no le enviaste mensajes.</p>'}</div>
      <label style="margin-top:12px;">Enviar un mensaje o archivo a este cliente</label>
      <textarea class="txtMsgAdmin" placeholder="Mensaje (opcional si adjuntás un archivo)"></textarea>
      <label>Adjuntar archivo (opcional)</label>
      <input type="file" class="archivoMsgAdmin">

      <button class="chica btnEliminarCliente" data-uid="${uid}" style="background:#b32424;color:#fff;margin-top:20px;">🗑️ Eliminar cliente</button>
      <div class="avisoEliminarCliente"></div>
    `;

    contenedor.querySelector('.btnEliminarCliente').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.target;
      const aviso = contenedor.querySelector('.avisoEliminarCliente');
      const primeraConfirmacion = confirm('¿Eliminar a este cliente? Se van a borrar su ficha, novedades, archivos y mensajes. Esta acción no se puede deshacer.');
      if (!primeraConfirmacion) return;
      const segundaConfirmacion = confirm('Confirmá de nuevo: esto es permanente. ¿Eliminar de todas formas?');
      if (!segundaConfirmacion) return;
      aviso.innerHTML = '<div class="aviso ok">Eliminando...</div>';
      try {
        const u = btn.dataset.uid;
        const [novSnap2, arcSnap2, msgSnap2] = await Promise.all([
          getDocs(collection(db, 'clientes', u, 'novedades')),
          getDocs(collection(db, 'clientes', u, 'archivos')),
          getDocs(collection(db, 'clientes', u, 'mensajes'))
        ]);
        const borrados = [];
        novSnap2.forEach(d => borrados.push(deleteDoc(doc(db, 'clientes', u, 'novedades', d.id))));
        arcSnap2.forEach(d => borrados.push(deleteDoc(doc(db, 'clientes', u, 'archivos', d.id))));
        msgSnap2.forEach(d => borrados.push(deleteDoc(doc(db, 'clientes', u, 'mensajes', d.id))));
        await Promise.all(borrados);
        await deleteDoc(doc(db, 'clientes', u));
        cacheClientes = cacheClientes.filter(c => c.uid !== u);
        contenedor.closest('.fila-cliente')?.remove();
      } catch (err) {
        aviso.innerHTML = '<div class="aviso error">Error al eliminar: ' + err.message + '</div>';
      }
    });

    contenedor.querySelectorAll('.btnBorrarItem').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        const ok = confirm('¿Borrar este item? No se puede deshacer.');
        if (!ok) return;
        const { uid: u, coleccion, id } = el.dataset;
        try {
          await deleteDoc(doc(db, 'clientes', u, coleccion, id));
          renderDetalleCliente(u, contenedor);
        } catch (err) {
          alert('Error al borrar: ' + err.message);
        }
      });
    });

    contenedor.querySelector('.btnEnviarMsgAdmin').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.target;
      const texto = contenedor.querySelector('.txtMsgAdmin').value.trim();
      const inputArchivo = contenedor.querySelector('.archivoMsgAdmin');
      const archivo = inputArchivo.files[0];
      const aviso = contenedor.querySelector('.avisoMsgAdmin');
      if (!texto && !archivo) { aviso.innerHTML = '<div class="aviso error">Escribí un mensaje o adjuntá un archivo.</div>'; return; }
      aviso.innerHTML = '<div class="aviso ok">Enviando...</div>';
      try {
        let archivoUrl = null, archivoNombre = null;
        if (archivo) {
          const refArchivo = ref(storage, 'clientes/' + btn.dataset.uid + '/admin_' + Date.now() + '_' + archivo.name);
          await uploadBytes(refArchivo, archivo);
          archivoUrl = await getDownloadURL(refArchivo);
          archivoNombre = archivo.name;
        }
        const datosMsg = { texto: texto || '', fecha: serverTimestamp() };
        if (archivoUrl) { datosMsg.archivoUrl = archivoUrl; datosMsg.archivoNombre = archivoNombre; }
        await addDoc(collection(db, 'clientes', btn.dataset.uid, 'mensajes'), datosMsg);
        aviso.innerHTML = '<div class="aviso ok">Mensaje enviado.</div>';
        contenedor.querySelector('.txtMsgAdmin').value = '';
        inputArchivo.value = '';
        renderDetalleCliente(uid, contenedor);
      } catch (err) {
        aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';
      }
    });
  } catch (err) {
    contenedor.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error: ' + err.message + '</p>';
  }
}

// ---------- AGENDA ----------
let mesActual = new Date();

async function renderTabAgenda(user) {
  const cont = document.getElementById('contenidoTab');
  cont.innerHTML = `
    <div class="caja">
      <h3>Agregar evento</h3>
      <label>Fecha</label>
      <input type="date" id="agFecha">
      <label>Título</label>
      <input type="text" id="agTitulo" placeholder="Ej: Audiencia, vencimiento, reunión...">
      <label>Cliente relacionado (opcional)</label>
      <select id="agCliente">
        <option value="">Sin cliente asociado</option>
        ${cacheClientes.map(c => `<option value="${c.uid}">${esc(nombreCompleto(c))}</option>`).join('')}
      </select>
      <label>Nota</label>
      <textarea id="agNota" placeholder="Detalles adicionales..."></textarea>
      <button id="btnAgregarEvento">Guardar evento</button>
      <div id="avisoAgenda"></div>
    </div>

    <div class="caja">
      <div style="display:flex;justify-content:space-between;align-items:center;font-family:Arial;">
        <button class="chica" id="mesAnterior" style="width:auto;margin:0;padding:6px 12px;">←</button>
        <h3 id="tituloMes"></h3>
        <button class="chica" id="mesSiguiente" style="width:auto;margin:0;padding:6px 12px;">→</button>
      </div>
      <div class="calendario" id="calendarioGrid"></div>
    </div>

    <div class="caja">
      <h3>Próximos eventos</h3>
      <div id="listaEventos" style="margin-top:8px;">Cargando...</div>
    </div>
  `;

  document.getElementById('btnAgregarEvento').onclick = async () => {
    const fecha = document.getElementById('agFecha').value;
    const titulo = document.getElementById('agTitulo').value.trim();
    const clienteUid = document.getElementById('agCliente').value;
    const nota = document.getElementById('agNota').value.trim();
    const aviso = document.getElementById('avisoAgenda');
    if (!fecha || !titulo) { aviso.innerHTML = '<div class="aviso error">Completá fecha y título.</div>'; return; }
    aviso.innerHTML = '<div class="aviso ok">Guardando...</div>';
    try {
      const clienteObj = clienteUid ? cacheClientes.find(c => c.uid === clienteUid) : null;
      const clienteNombre = clienteObj ? nombreCompleto(clienteObj) : '';
      const clienteTelefono = clienteObj ? (clienteObj.telefono || '') : '';
      await addDoc(collection(db, 'agenda'), {
        fecha, titulo, nota, clienteUid, clienteNombre, clienteTelefono,
        fechaCreacion: serverTimestamp()
      });
      aviso.innerHTML = '<div class="aviso ok">Evento guardado.</div>';
      document.getElementById('agTitulo').value = '';
      document.getElementById('agNota').value = '';
      cargarCalendario();
      cargarListaEventos();
    } catch (err) {
      aviso.innerHTML = '<div class="aviso error">Error: ' + err.message + '</div>';
    }
  };

  document.getElementById('mesAnterior').onclick = () => { mesActual.setMonth(mesActual.getMonth() - 1); cargarCalendario(); };
  document.getElementById('mesSiguiente').onclick = () => { mesActual.setMonth(mesActual.getMonth() + 1); cargarCalendario(); };

  await cargarCalendario();
  await cargarListaEventos();
}

async function obtenerTodosLosEventos() {
  const snap = await getDocs(collection(db, 'agenda'));
  let eventos = [];
  snap.forEach(d => eventos.push({ id: d.id, ...d.data() }));
  return eventos;
}

async function cargarCalendario() {
  const grid = document.getElementById('calendarioGrid');
  const titulo = document.getElementById('tituloMes');
  if (!grid) return;

  const nombresMeses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  titulo.textContent = nombresMeses[mesActual.getMonth()] + ' ' + mesActual.getFullYear();

  const eventos = await obtenerTodosLosEventos();
  const fechasConEvento = new Set(eventos.map(e => e.fecha));

  const primerDia = new Date(mesActual.getFullYear(), mesActual.getMonth(), 1);
  const ultimoDia = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0);
  const diaSemanaInicio = primerDia.getDay();
  const hoyStr = new Date().toISOString().slice(0, 10);

  let html = ['D','L','M','M','J','V','S'].map(d => `<div class="diaSemana">${d}</div>`).join('');
  for (let i = 0; i < diaSemanaInicio; i++) html += '<div></div>';
  for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
    const fechaStr = mesActual.getFullYear() + '-' + String(mesActual.getMonth() + 1).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
    const clases = ['diaCal'];
    if (fechaStr === hoyStr) clases.push('hoy');
    if (fechasConEvento.has(fechaStr)) clases.push('conEvento');
    html += `<div class="${clases.join(' ')}">${dia}</div>`;
  }
  grid.innerHTML = html;
}

// ---------- WHATSAPP: armar link con mensaje precargado ----------
function linkWhatsapp(telefono, mensaje) {
  const digitos = (telefono || '').replace(/\D/g, '');
  if (!digitos) return null;
  const numero = digitos.startsWith('54') ? digitos : '549' + digitos.replace(/^0/, '');
  return 'https://wa.me/' + numero + '?text=' + encodeURIComponent(mensaje);
}

async function cargarListaEventos() {
  const cont = document.getElementById('listaEventos');
  if (!cont) return;
  try {
    const eventos = await obtenerTodosLosEventos();
    const hoyStr = new Date().toISOString().slice(0, 10);
    const futuros = eventos.filter(e => e.fecha >= hoyStr).sort((a, b) => a.fecha.localeCompare(b.fecha));

    if (futuros.length === 0) {
      cont.innerHTML = '<p style="font-size:13px;color:#888;font-family:Arial;">No hay eventos próximos.</p>';
      return;
    }
    cont.innerHTML = futuros.map(e => {
      const [y, m, d] = e.fecha.split('-');
      let botonWa = '';
      if (e.clienteTelefono) {
        const mensaje = `Hola ${e.clienteNombre || ''}, le recuerdo desde el estudio del Dr. Diego Mayorga: ${e.titulo} el ${d}/${m}/${y}.`;
        const link = linkWhatsapp(e.clienteTelefono, mensaje);
        if (link) botonWa = ` <a href="${link}" target="_blank" style="color:#1ea952;text-decoration:none;">📲 WhatsApp</a>`;
      }
      const botonBorrar = ` <span class="btnBorrarEvento" data-id="${e.id}" style="float:right;cursor:pointer;color:#b32424;">🗑️</span>`;
      return `<div class="lista-item">${botonBorrar}📅 <strong>${d}/${m}/${y}</strong> — ${esc(e.titulo)}${e.clienteNombre ? ' (' + esc(e.clienteNombre) + ')' : ''}${botonWa}${e.nota ? '<br><span style="color:#666;">' + esc(e.nota) + '</span>' : ''}</div>`;
    }).join('');

    cont.querySelectorAll('.btnBorrarEvento').forEach(el => {
      el.addEventListener('click', async () => {
        const ok = confirm('¿Borrar este evento de la agenda? No se puede deshacer.');
        if (!ok) return;
        try {
          await deleteDoc(doc(db, 'agenda', el.dataset.id));
          cargarCalendario();
          cargarListaEventos();
        } catch (err) {
          alert('Error al borrar: ' + err.message);
        }
      });
    });
  } catch (err) {
    cont.innerHTML = '<p style="font-size:13px;color:#b32424;font-family:Arial;">Error: ' + err.message + '</p>';
  }
}

async function revisarAlertasHoy() {
  const box = document.getElementById('alertaHoyBox');
  if (!box) return;
  try {
    const eventos = await obtenerTodosLosEventos();
    const hoyStr = new Date().toISOString().slice(0, 10);
    const deHoy = eventos.filter(e => e.fecha === hoyStr);
    if (deHoy.length > 0) {
      box.innerHTML = `<div class="alertaHoy">⚠️ Tenés ${deHoy.length} evento${deHoy.length > 1 ? 's' : ''} agendado${deHoy.length > 1 ? 's' : ''} para hoy: ${deHoy.map(e => esc(e.titulo)).join(', ')}</div>`;
    }
  } catch (err) {
    box.innerHTML = '';
  }
}

async function revisarProximosVencimientos() {
  const box = document.getElementById('alertaProximosBox');
  if (!box) return;
  try {
    const eventos = await obtenerTodosLosEventos();
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const hoyStr = hoy.toISOString().slice(0, 10);
    const limite = new Date(hoy);
    limite.setDate(limite.getDate() + 3);

    const proximos = eventos
      .filter(e => e.fecha > hoyStr && new Date(e.fecha + 'T00:00:00') <= limite)
      .sort((a, b) => a.fecha.localeCompare(b.fecha));

    if (proximos.length > 0) {
      const items = proximos.map(e => {
        const dias = Math.round((new Date(e.fecha + 'T00:00:00') - hoy) / 86400000);
        return `${esc(e.titulo)} (en ${dias} día${dias > 1 ? 's' : ''})`;
      }).join(', ');
      box.innerHTML = `<div class="alertaHoy" style="background:#FFF4E0;color:#8a5a00;">⏳ Próximos vencimientos: ${items}</div>`;
    } else {
      box.innerHTML = '';
    }
  } catch (err) {
    box.innerHTML = '';
  }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    pantallaLogin(false);
    return;
  }

  const mostrarContenido = async () => {
    if (user.email === ADMIN_EMAIL) {
      pantallaAdmin(user);
      return;
    }

    cuerpo.innerHTML = '<div class="carga-inicial" style="color:#0F1E3D;">Cargando tus datos...</div>';
    try {
      const snap = await getDoc(doc(db, 'clientes', user.uid));
      if (snap.exists()) {
        pantallaDashboard(user, snap.data());
      } else {
        pantallaFormulario(user);
      }
    } catch (err) {
      cuerpo.innerHTML = '<div class="aviso error">Error al cargar: ' + err.message + '</div>';
    }
  };

  if (tieneCredencialGuardada()) {
    pantallaBloqueo(mostrarContenido);
  } else {
    mostrarContenido();
  }
});
